name: Build APK

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID pekerjaan"
        required: true
        type: string
      mode:
        description: "url atau upload"
        required: true
        type: string
      url:
        description: "URL website (mode url)"
        required: false
        type: string
        default: ""
      app_name:
        required: true
        type: string
      app_id:
        required: true
        type: string
      has_icon:
        required: true
        type: string
      perms:
        description: "daftar izin, dipisah koma"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JOB_ID: ${{ inputs.job_id }}
      MODE: ${{ inputs.mode }}
      SITE_URL: ${{ inputs.url }}
      APP_NAME: ${{ inputs.app_name }}
      APP_ID: ${{ inputs.app_id }}
      HAS_ICON: ${{ inputs.has_icon }}
      PERMS: ${{ inputs.perms }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      BUILD_SECRET: ${{ secrets.BUILD_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Cek input dasar
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::job_id tidak valid"; exit 1; }
          [[ "$MODE" == "url" || "$MODE" == "upload" ]] || { echo "::error::mode tidak valid"; exit 1; }
          [[ "$HAS_ICON" == "true" || "$HAS_ICON" == "false" ]] || { echo "::error::has_icon tidak valid"; exit 1; }
          [[ "$PERMS" =~ ^[a-z,]*$ ]] || { echo "::error::izin tidak valid"; exit 1; }
          test -f builder/make-config.js || { echo "::error::builder/make-config.js tidak ada di repo"; exit 1; }
          test -f builder/make-icon.js || { echo "::error::builder/make-icon.js tidak ada di repo"; exit 1; }
          test -f builder/inject-guard.js || { echo "::error::builder/inject-guard.js tidak ada di repo"; exit 1; }

      - name: Kabari Worker (mulai membangun)
        run: |
          curl -fsS --retry 3 --retry-delay 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"status":"building","progress":5,"step":"Memulai"}'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Progress 15%
        run: |
          curl -sS --retry 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" -H "Content-Type: application/json" \
            -d '{"status":"building","progress":15,"step":"Menyiapkan proyek"}' || true

      - name: Siapkan proyek Capacitor
        run: |
          set -euo pipefail
          mkdir app && cd app
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3 sharp
          cp ../builder/make-config.js ../builder/make-icon.js .
          node make-config.js
          mkdir www

      - name: Mode URL - halaman pengganti
        if: ${{ inputs.mode == 'url' }}
        run: |
          echo '<!doctype html><meta charset="utf-8"><title>Memuat</title><p>Memuat...</p>' > app/www/index.html

      - name: Mode upload - unduh dan siapkan file
        if: ${{ inputs.mode == 'upload' }}
        run: |
          set -euo pipefail
          cd app
          curl -fsS --retry 3 --retry-delay 2 -H "Authorization: Bearer $BUILD_SECRET" "$WORKER_URL/internal/file/$JOB_ID" -o upload.bin
          if [ "$(head -c 2 upload.bin)" = "PK" ]; then
            TOTAL=$(unzip -Z -t upload.bin | awk '{print $3}')
            if ! [[ "$TOTAL" =~ ^[0-9]+$ ]]; then echo "::error::ZIP tidak bisa dibaca"; exit 1; fi
            if [ "$TOTAL" -gt 50000000 ]; then echo "::error::Isi ZIP terlalu besar setelah diekstrak"; exit 1; fi
            mkdir tmp_unzip
            unzip -q upload.bin -d tmp_unzip
            rm -rf tmp_unzip/__MACOSX
            if [ -f tmp_unzip/index.html ]; then
              SRC=tmp_unzip
            else
              COUNT=$(find tmp_unzip -mindepth 1 -maxdepth 1 | wc -l)
              DIR=$(find tmp_unzip -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ "$COUNT" -eq 1 ] && [ -n "$DIR" ] && [ -f "$DIR/index.html" ]; then
                SRC="$DIR"
              else
                echo "::error::ZIP tidak punya index.html di root (atau di satu folder pembungkus)"
                exit 1
              fi
            fi
            cp -a "$SRC"/. www/
          else
            cp upload.bin www/index.html
          fi
          find www -type l -delete
          test -f www/index.html
          rm -rf upload.bin tmp_unzip

      - name: Unduh ikon (jika ada)
        if: ${{ inputs.has_icon == 'true' }}
        run: |
          curl -fsS --retry 3 --retry-delay 2 -H "Authorization: Bearer $BUILD_SECRET" "$WORKER_URL/internal/icon/$JOB_ID" -o app/icon-src.bin

      - name: Progress 45%
        run: |
          curl -sS --retry 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" -H "Content-Type: application/json" \
            -d '{"status":"building","progress":45,"step":"Menyiapkan Android dan ikon"}' || true

      - name: Tambah Android dan buat ikon
        run: |
          set -euo pipefail
          cd app
          node make-icon.js
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Tambah izin aplikasi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          M = "app/android/app/src/main/AndroidManifest.xml"
          MAP = {
            "camera": ["android.permission.CAMERA"],
            "microphone": ["android.permission.RECORD_AUDIO", "android.permission.MODIFY_AUDIO_SETTINGS"],
            "location": ["android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION"],
            "notifications": ["android.permission.POST_NOTIFICATIONS"],
            "media": ["android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VIDEO", "android.permission.READ_MEDIA_AUDIO"],
          }
          want = [p for p in os.environ.get("PERMS", "").split(",") if p in MAP]
          lines = []
          for p in want:
              lines += ['    <uses-permission android:name="%s" />' % x for x in MAP[p]]
          if "media" in want:
              lines.append('    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />')
          if "camera" in want:
              lines.append('    <uses-feature android:name="android.hardware.camera" android:required="false" />')
          if "microphone" in want:
              lines.append('    <uses-feature android:name="android.hardware.microphone" android:required="false" />')
          if lines:
              s = open(M, encoding="utf-8").read()
              assert "</manifest>" in s
              open(M, "w", encoding="utf-8").write(s.replace("</manifest>", "\n".join(lines) + "\n</manifest>"))
          print("Izin ditambahkan:", want)
          PY
          if [[ ",$PERMS," == *",notifications,"* ]]; then
            cd app
            npm install --no-audit --no-fund @capacitor/local-notifications@6
            npx cap sync android
          fi

      - name: Tanam penjaga status APK
        run: |
          set -euo pipefail
          cp builder/inject-guard.js app/
          cd app
          node inject-guard.js

      - name: Progress 60%
        run: |
          curl -sS --retry 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" -H "Content-Type: application/json" \
            -d '{"status":"building","progress":60,"step":"Membangun APK"}' || true

      - name: Bangun APK
        run: |
          set -euo pipefail
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Progress 92%
        run: |
          curl -sS --retry 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" -H "Content-Type: application/json" \
            -d '{"status":"building","progress":92,"step":"Menerbitkan APK"}' || true

      - name: Terbitkan Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SAFE=$(printf '%s' "$APP_NAME" | tr -cs 'A-Za-z0-9' '-' | sed 's/^-//; s/-$//')
          [ -n "$SAFE" ] || SAFE=app
          mkdir -p dist
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "dist/$SAFE.apk"
          # jika workflow dijalankan ulang untuk job yang sama, hapus release lama dulu
          gh release delete "job-$JOB_ID" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "job-$JOB_ID" "dist/$SAFE.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "APK $SAFE" \
            --notes "APK debug dibuat otomatis oleh pengguna. Pakai dengan risiko sendiri."
          echo "APK_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/job-$JOB_ID/$SAFE.apk" >> "$GITHUB_ENV"

      - name: Kabari Worker (selesai)
        run: |
          curl -fsS --retry 3 --retry-delay 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"done\",\"apkUrl\":\"$APK_URL\"}"

      - name: Bersihkan release lama (lebih dari 14 hari)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq ".[] | select(.tagName | startswith(\"job-\")) | select(.createdAt < \"$CUTOFF\") | .tagName" |
          while read -r TAG; do
            [ -n "$TAG" ] && gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done

      - name: Kabari Worker (gagal)
        if: ${{ failure() }}
        run: |
          curl -sS --retry 3 --retry-delay 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"failed\",\"runUrl\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" || true

      - name: Hapus file sementara
        if: ${{ always() }}
        run: |
          curl -sS -X DELETE "$WORKER_URL/internal/file/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" || true
