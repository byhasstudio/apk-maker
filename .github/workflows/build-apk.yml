name: Build APK

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID pekerjaan"
        required: true
        type: string
      mode:
        description: "url atau upload"
        required: true
        type: string
      url:
        description: "URL website (mode url)"
        required: false
        type: string
        default: ""
      app_name:
        required: true
        type: string
      app_id:
        required: true
        type: string
      has_icon:
        required: true
        type: string
      perms:
        description: "daftar izin, dipisah koma"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JOB_ID: ${{ inputs.job_id }}
      MODE: ${{ inputs.mode }}
      SITE_URL: ${{ inputs.url }}
      APP_NAME: ${{ inputs.app_name }}
      APP_ID: ${{ inputs.app_id }}
      HAS_ICON: ${{ inputs.has_icon }}
      PERMS: ${{ inputs.perms }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      BUILD_SECRET: ${{ secrets.BUILD_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Cek input dasar
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::job_id tidak valid"; exit 1; }
          [[ "$MODE" == "url" || "$MODE" == "upload" ]] || { echo "::error::mode tidak valid"; exit 1; }
          [[ "$HAS_ICON" == "true" || "$HAS_ICON" == "false" ]] || { echo "::error::has_icon tidak valid"; exit 1; }
          [[ "$PERMS" =~ ^[a-z,]*$ ]] || { echo "::error::izin tidak valid"; exit 1; }
          test -f builder/make-config.js || { echo "::error::builder/make-config.js tidak ada di repo"; exit 1; }
          test -f builder/make-icon.js || { echo "::error::builder/make-icon.js tidak ada di repo"; exit 1; }

      - name: Siapkan pelapor progres
        run: |
          cat > "$GITHUB_WORKSPACE/.pg.sh" <<'EOS'
          pg() {
            curl -sS --max-time 15 --retry 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
              -H "Authorization: Bearer $BUILD_SECRET" -H "Content-Type: application/json" \
              -d "{\"status\":\"building\",\"progress\":$1,\"step\":\"$2\"}" >/dev/null || true
          }
          EOS

      - name: Kabari Worker (mulai membangun)
        run: |
          curl -fsS --retry 3 --retry-delay 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"status":"building","progress":5,"step":"Memulai"}'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Progress 15%
        run: |
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 15 "Alat siap (Node.js dan Java)"

      - name: Siapkan proyek Capacitor
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 20 "Memasang Capacitor"
          mkdir app && cd app
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3 sharp
          pg 28 "Membuat konfigurasi"
          cp ../builder/make-config.js ../builder/make-icon.js .
          node make-config.js
          mkdir www

      - name: Mode URL - halaman pengganti
        if: ${{ inputs.mode == 'url' }}
        run: |
          echo '<!doctype html><meta charset="utf-8"><title>Memuat</title><p>Memuat...</p>' > app/www/index.html

      - name: Mode upload - unduh dan siapkan file
        if: ${{ inputs.mode == 'upload' }}
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 35 "Mengunduh dan menyiapkan file"
          cd app
          curl -fsS --retry 3 --retry-delay 2 -H "Authorization: Bearer $BUILD_SECRET" "$WORKER_URL/internal/file/$JOB_ID" -o upload.bin
          if [ "$(head -c 2 upload.bin)" = "PK" ]; then
            TOTAL=$(unzip -Z -t upload.bin | awk '{print $3}')
            if ! [[ "$TOTAL" =~ ^[0-9]+$ ]]; then echo "::error::ZIP tidak bisa dibaca"; exit 1; fi
            if [ "$TOTAL" -gt 50000000 ]; then echo "::error::Isi ZIP terlalu besar setelah diekstrak"; exit 1; fi
            mkdir tmp_unzip
            unzip -q upload.bin -d tmp_unzip
            rm -rf tmp_unzip/__MACOSX
            if [ -f tmp_unzip/index.html ]; then
              SRC=tmp_unzip
            else
              COUNT=$(find tmp_unzip -mindepth 1 -maxdepth 1 | wc -l)
              DIR=$(find tmp_unzip -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ "$COUNT" -eq 1 ] && [ -n "$DIR" ] && [ -f "$DIR/index.html" ]; then
                SRC="$DIR"
              else
                echo "::error::ZIP tidak punya index.html di root (atau di satu folder pembungkus)"
                exit 1
              fi
            fi
            cp -a "$SRC"/. www/
          else
            cp upload.bin www/index.html
          fi
          find www -type l -delete
          test -f www/index.html
          rm -rf upload.bin tmp_unzip

      - name: Unduh ikon (jika ada)
        if: ${{ inputs.has_icon == 'true' }}
        run: |
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 42 "Mengunduh ikon"
          curl -fsS --retry 3 --retry-delay 2 -H "Authorization: Bearer $BUILD_SECRET" "$WORKER_URL/internal/icon/$JOB_ID" -o app/icon-src.bin

      - name: Progress 45%
        run: |
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 45 "Memproses ikon"

      - name: Tambah Android dan buat ikon
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.pg.sh"
          cd app
          pg 48 "Membuat ikon"
          node make-icon.js
          pg 52 "Menambah platform Android"
          npx cap add android
          pg 56 "Menerapkan ikon penuh"
          npx capacitor-assets generate --android
          node make-icon.js android
          npx cap sync android

      - name: Pasang kill switch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, re
          JAVA = r'''package __PKG__;

          import android.content.SharedPreferences;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends BridgeActivity {
            private static final String API = "__API__";
            private static final String JOB = "__JOB__";
            private static final String HTML = "<html><head><meta name='viewport' content='width=device-width,initial-scale=1'></head><body style='margin:0;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;background:#111827;color:#f9fafb;text-align:center'><div><div style='font-size:64px'>&#128683;</div><h2>Aplikasi ini telah diblokir</h2><p style='color:#9ca3af'>Hubungi pembuat aplikasi untuk informasi lebih lanjut.</p></div></body></html>";
            private volatile boolean checking = false;
            private volatile boolean blocked = false;

            @Override
            public void onResume() {
              super.onResume();
              final SharedPreferences sp = getSharedPreferences("ks", MODE_PRIVATE);
              blocked = sp.getBoolean("blocked", false);
              if (blocked) showBlocked();
              check(sp);
            }

            private void showBlocked() {
              try {
                final WebView wv = getBridge().getWebView();
                wv.loadDataWithBaseURL(null, HTML, "text/html", "utf-8", null);
                new Handler(Looper.getMainLooper()).postDelayed(() -> {
                  if (blocked) wv.loadDataWithBaseURL(null, HTML, "text/html", "utf-8", null);
                }, 2000);
              } catch (Exception ignored) {}
            }

            private void check(final SharedPreferences sp) {
              if (checking) return;
              checking = true;
              new Thread(() -> {
                Boolean result = null;
                try {
                  HttpURLConnection c = (HttpURLConnection) new URL(API + "/api/app-status/" + JOB).openConnection();
                  c.setConnectTimeout(6000);
                  c.setReadTimeout(6000);
                  if (c.getResponseCode() == 200) {
                    BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream()));
                    StringBuilder sb = new StringBuilder();
                    String ln;
                    while ((ln = r.readLine()) != null) sb.append(ln);
                    r.close();
                    result = sb.toString().replace(" ", "").contains("\"blocked\":true");
                  }
                  c.disconnect();
                } catch (Exception ignored) {}
                checking = false;
                if (result == null) return;
                final boolean now = result;
                sp.edit().putBoolean("blocked", now).apply();
                runOnUiThread(() -> {
                  boolean was = blocked;
                  blocked = now;
                  if (now) showBlocked();
                  else if (was) { try { getBridge().reload(); } catch (Exception ignored) {} }
                });
              }).start();
            }
          }
          '''
          api = os.environ.get("WORKER_URL", "").rstrip("/")
          job = os.environ["JOB_ID"]
          assert re.fullmatch(r"https://[A-Za-z0-9._:/-]+", api), "WORKER_URL tidak valid"
          assert re.fullmatch(r"[0-9a-f-]{36}", job), "JOB_ID tidak valid"
          files = glob.glob("app/android/app/src/main/java/**/MainActivity.java", recursive=True)
          assert len(files) == 1, files
          f = files[0]
          pkg = re.search(r"^package\s+([\w.]+);", open(f, encoding="utf-8").read(), re.M).group(1)
          open(f, "w", encoding="utf-8").write(JAVA.replace("__PKG__", pkg).replace("__API__", api).replace("__JOB__", job))
          print("Kill switch dipasang di", f)
          PY

      - name: Tambah izin aplikasi
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 60 "Menambah izin aplikasi"
          python3 - <<'PY'
          import os
          M = "app/android/app/src/main/AndroidManifest.xml"
          MAP = {
            "camera": ["android.permission.CAMERA"],
            "microphone": ["android.permission.RECORD_AUDIO", "android.permission.MODIFY_AUDIO_SETTINGS"],
            "location": ["android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION"],
            "notifications": ["android.permission.POST_NOTIFICATIONS"],
            "media": ["android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VIDEO", "android.permission.READ_MEDIA_AUDIO"],
          }
          want = [p for p in os.environ.get("PERMS", "").split(",") if p in MAP]
          lines = []
          for p in want:
              lines += ['    <uses-permission android:name="%s" />' % x for x in MAP[p]]
          if "media" in want:
              lines.append('    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />')
          if "camera" in want:
              lines.append('    <uses-feature android:name="android.hardware.camera" android:required="false" />')
          if "microphone" in want:
              lines.append('    <uses-feature android:name="android.hardware.microphone" android:required="false" />')
          if lines:
              s = open(M, encoding="utf-8").read()
              assert "</manifest>" in s
              open(M, "w", encoding="utf-8").write(s.replace("</manifest>", "\n".join(lines) + "\n</manifest>"))
          print("Izin ditambahkan:", want)
          PY
          if [[ ",$PERMS," == *",notifications,"* ]]; then
            cd app
            npm install --no-audit --no-fund @capacitor/local-notifications@6
            npx cap sync android
          fi

      - name: Progress 60%
        run: |
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 63 "Memulai build Gradle"

      - name: Bangun APK
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.pg.sh"
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon &
          PID=$!
          P=64; T=0
          while kill -0 "$PID" 2>/dev/null; do
            sleep 1; T=$((T+1))
            if [ $((T % 15)) -eq 0 ]; then
              P=$((P+2)); [ $P -gt 88 ] && P=88
              if [ $P -lt 70 ]; then M="Mengunduh dependensi Gradle"; elif [ $P -lt 80 ]; then M="Mengompilasi kode"; else M="Merakit APK"; fi
              pg $P "$M"
            fi
          done
          wait "$PID"

      - name: Progress 92%
        run: |
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 92 "Menerbitkan APK"

      - name: Terbitkan Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SAFE=$(printf '%s' "$APP_NAME" | tr -cs 'A-Za-z0-9' '-' | sed 's/^-//; s/-$//')
          [ -n "$SAFE" ] || SAFE=app
          mkdir -p dist
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "dist/$SAFE.apk"
          # jika workflow dijalankan ulang untuk job yang sama, hapus release lama dulu
          gh release delete "job-$JOB_ID" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "job-$JOB_ID" "dist/$SAFE.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "APK $SAFE" \
            --notes "APK debug dibuat otomatis oleh pengguna. Pakai dengan risiko sendiri."
          echo "APK_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/job-$JOB_ID/$SAFE.apk" >> "$GITHUB_ENV"

      - name: Kabari Worker (selesai)
        run: |
          curl -fsS --retry 3 --retry-delay 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"done\",\"apkUrl\":\"$APK_URL\"}"

      - name: Bersihkan release lama (lebih dari 14 hari)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq ".[] | select(.tagName | startswith(\"job-\")) | select(.createdAt < \"$CUTOFF\") | .tagName" |
          while read -r TAG; do
            [ -n "$TAG" ] && gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done

      - name: Kabari Worker (gagal)
        if: ${{ failure() }}
        run: |
          curl -sS --retry 3 --retry-delay 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"failed\",\"runUrl\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" || true

      - name: Hapus file sementara
        if: ${{ always() }}
        run: |
          curl -sS -X DELETE "$WORKER_URL/internal/file/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" || true
