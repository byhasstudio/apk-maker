name: Build APK
run-name: Build APK ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID pekerjaan"
        required: true
        type: string
      mode:
        description: "url atau upload"
        required: true
        type: string
      url:
        description: "URL website (mode url)"
        required: false
        type: string
        default: ""
      app_name:
        required: true
        type: string
      version:
        description: "versi aplikasi, contoh 1.0.0"
        required: true
        type: string
      app_id:
        required: true
        type: string
      has_icon:
        required: true
        type: string
      perms:
        description: "daftar izin, dipisah koma"
        required: false
        type: string
        default: ""
      secure:
        description: "anti-screenshot (true/false)"
        required: false
        type: string
        default: "false"
      lock:
        description: "kunci layar HP (true/false)"
        required: false
        type: string
        default: "false"
      orient:
        description: "orientasi layar: auto, portrait, landscape"
        required: false
        type: string
        default: "auto"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JOB_ID: ${{ inputs.job_id }}
      MODE: ${{ inputs.mode }}
      SITE_URL: ${{ inputs.url }}
      APP_NAME: ${{ inputs.app_name }}
      APP_ID: ${{ inputs.app_id }}
      HAS_ICON: ${{ inputs.has_icon }}
      VERSION: ${{ inputs.version }}
      PERMS: ${{ inputs.perms }}
      SECURE: ${{ inputs.secure }}
      LOCK: ${{ inputs.lock }}
      ORIENT: ${{ inputs.orient }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      BUILD_SECRET: ${{ secrets.BUILD_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Cek input dasar
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::job_id tidak valid"; exit 1; }
          [[ "$MODE" == "url" || "$MODE" == "upload" ]] || { echo "::error::mode tidak valid"; exit 1; }
          [[ "$HAS_ICON" == "true" || "$HAS_ICON" == "false" ]] || { echo "::error::has_icon tidak valid"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || { echo "::error::versi tidak valid"; exit 1; }
          [[ "$PERMS" =~ ^[a-z,]*$ ]] || { echo "::error::izin tidak valid"; exit 1; }
          [[ "$SECURE" == "true" || "$SECURE" == "false" ]] || { echo "::error::secure tidak valid"; exit 1; }
          [[ "$LOCK" == "true" || "$LOCK" == "false" ]] || { echo "::error::lock tidak valid"; exit 1; }
          [[ "$ORIENT" == "auto" || "$ORIENT" == "portrait" || "$ORIENT" == "landscape" ]] || { echo "::error::orientasi tidak valid"; exit 1; }
          test -f builder/make-config.js || { echo "::error::builder/make-config.js tidak ada di repo"; exit 1; }
          test -f builder/make-icon.js || { echo "::error::builder/make-icon.js tidak ada di repo"; exit 1; }

      - name: Siapkan pelapor progres
        run: |
          cat > "$GITHUB_WORKSPACE/.pg.sh" <<'EOS'
          pg() {
            curl -sS --max-time 15 --retry 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
              -H "Authorization: Bearer $BUILD_SECRET" -H "Content-Type: application/json" \
              -d "{\"status\":\"building\",\"progress\":$1,\"step\":\"$2\"}" >/dev/null || true
          }
          EOS

      - name: Kabari Worker (mulai membangun)
        run: |
          curl -fsS --retry 3 --retry-delay 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"status":"building","progress":5,"step":"Memulai"}'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Progress 15%
        run: |
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 15 "Alat siap (Node.js dan Java)"

      - name: Siapkan proyek Capacitor
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 20 "Memasang Capacitor"
          mkdir app && cd app
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3 sharp
          pg 28 "Membuat konfigurasi"
          cp ../builder/make-config.js ../builder/make-icon.js .
          node make-config.js
          mkdir www

      - name: Mode URL - halaman pengganti
        if: ${{ inputs.mode == 'url' }}
        run: |
          echo '<!doctype html><meta charset="utf-8"><title>Memuat</title><p>Memuat...</p>' > app/www/index.html

      - name: Mode upload - unduh dan siapkan file
        if: ${{ inputs.mode == 'upload' }}
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 35 "Mengunduh dan menyiapkan file"
          cd app
          curl -fsS --retry 3 --retry-delay 2 -H "Authorization: Bearer $BUILD_SECRET" "$WORKER_URL/internal/file/$JOB_ID" -o upload.bin
          if [ "$(head -c 2 upload.bin)" = "PK" ]; then
            TOTAL=$(unzip -Z -t upload.bin | awk '{print $3}')
            if ! [[ "$TOTAL" =~ ^[0-9]+$ ]]; then echo "::error::ZIP tidak bisa dibaca"; exit 1; fi
            if [ "$TOTAL" -gt 200000000 ]; then echo "::error::Isi ZIP terlalu besar setelah diekstrak"; exit 1; fi
            mkdir tmp_unzip
            unzip -q upload.bin -d tmp_unzip
            rm -rf tmp_unzip/__MACOSX
            SRC=""
            if [ -f tmp_unzip/index.html ]; then
              SRC=tmp_unzip
            else
              # cari index.html (huruf besar/kecil bebas) di folder paling dangkal
              IDX=$(find tmp_unzip -type f -iname 'index.html' -not -path '*/node_modules/*' | awk -F/ '{print NF" "$0}' | sort -n | head -n 1 | cut -d' ' -f2-)
              if [ -n "$IDX" ]; then
                SRC=$(dirname "$IDX")
                [ "$(basename "$IDX")" = "index.html" ] || cp "$IDX" "$SRC/index.html"
              else
                HCOUNT=$(find tmp_unzip -type f \( -iname '*.html' -o -iname '*.htm' \) | wc -l)
                if [ "$HCOUNT" -eq 1 ]; then
                  H=$(find tmp_unzip -type f \( -iname '*.html' -o -iname '*.htm' \) | head -n 1)
                  SRC=$(dirname "$H")
                  cp "$H" "$SRC/index.html"
                else
                  echo "::error::ZIP tidak punya index.html (dan HTML-nya lebih dari satu)"
                  exit 1
                fi
              fi
            fi
            cp -a "$SRC"/. www/
          else
            cp upload.bin www/index.html
          fi
          find www -type l -delete
          test -f www/index.html
          rm -rf upload.bin tmp_unzip

      - name: Unduh ikon (jika ada)
        if: ${{ inputs.has_icon == 'true' }}
        run: |
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 42 "Mengunduh ikon"
          curl -fsS --retry 3 --retry-delay 2 -H "Authorization: Bearer $BUILD_SECRET" "$WORKER_URL/internal/icon/$JOB_ID" -o app/icon-src.bin

      - name: Progress 45%
        run: |
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 45 "Memproses ikon"

      - name: Tambah Android dan buat ikon
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.pg.sh"
          cd app
          pg 48 "Membuat ikon"
          node make-icon.js
          pg 52 "Menambah platform Android"
          npx cap add android
          pg 56 "Menerapkan ikon penuh"
          npx capacitor-assets generate --android
          node make-icon.js android
          npx cap sync android

      - name: Atur versi aplikasi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          v = os.environ["VERSION"]
          a, b, c = [int(x) for x in v.split(".")]
          code = a * 1000000 + b * 1000 + c
          f = "app/android/app/build.gradle"
          s = open(f, encoding="utf-8").read()
          s, n1 = re.subn(r"versionCode\s+\d+", "versionCode %d" % code, s, count=1)
          s, n2 = re.subn(r'versionName\s+"[^"]*"', 'versionName "%s"' % v, s, count=1)
          assert n1 == 1 and n2 == 1, "build.gradle tidak berisi versionCode/versionName"
          open(f, "w", encoding="utf-8").write(s)
          print("Versi", v, "kode", code)
          PY

      - name: Pasang kill switch dan halaman offline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, re
          JAVA = r'''package __PKG__;

          import android.content.SharedPreferences;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends BridgeActivity {
            private static final String API = "__API__";
            private static final String JOB = "__JOB__";
            private static final String HTML = "<html><head><meta name='viewport' content='width=device-width,initial-scale=1'></head><body style='margin:0;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;background:#111827;color:#f9fafb;text-align:center'><div><div style='font-size:64px'>&#128683;</div><h2>Aplikasi ini sedang dinonaktifkan</h2><p style='color:#9ca3af'>Hubungi pembuat aplikasi untuk informasi lebih lanjut.</p></div></body></html>";
            private static final String OFFLINE = "__OFFLINE__";
            private static final boolean SECURE = __SECURE__;
            private static final boolean LOCK = __LOCK__;
            private boolean unlocked = false, prompting = false, first = true;
            private static final String FORCE = "<html><head><meta name='viewport' content='width=device-width,initial-scale=1'></head><body style='margin:0;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;background:#111827;color:#f9fafb;text-align:center;padding:24px;box-sizing:border-box'><div><div style='font-size:64px'>&#11015;</div><h2>Versi ini sudah usang</h2><p style='color:#9ca3af'>Unduh versi terbaru untuk melanjutkan.</p><a href='__U__' style='display:inline-block;margin-top:12px;padding:12px 28px;border-radius:12px;background:#4f46e5;color:#fff;text-decoration:none;font-weight:700'>Unduh versi terbaru</a></div></body></html>";
            private volatile String force = "", msg = "", mid = "";
            private boolean forced = false;
            private volatile boolean checking = false;
            private volatile boolean blocked = false;

            @Override
            public void onCreate(android.os.Bundle savedInstanceState) {
              if (SECURE) getWindow().setFlags(android.view.WindowManager.LayoutParams.FLAG_SECURE, android.view.WindowManager.LayoutParams.FLAG_SECURE);
              super.onCreate(savedInstanceState);
              if (OFFLINE.length() > 0) {
                try {
                  getBridge().setWebViewClient(new BridgeWebViewClient(getBridge()) {
                    @Override
                    public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                      super.onReceivedError(view, request, error);
                      if (request != null && request.isForMainFrame()) {
                        view.loadDataWithBaseURL(null, blocked ? HTML : OFFLINE, "text/html", "utf-8", null);
                      }
                    }
                  });
                } catch (Exception ignored) {}
              }
            }

            @Override
            public void onResume() {
              super.onResume();
              if (LOCK && !unlocked) lockNow();
              final SharedPreferences sp = getSharedPreferences("ks", MODE_PRIVATE);
              blocked = sp.getBoolean("blocked", false);
              if (blocked) showBlocked();
              check(sp);
            }

            private void showBlocked() {
              try {
                final WebView wv = getBridge().getWebView();
                wv.loadDataWithBaseURL(null, HTML, "text/html", "utf-8", null);
                new Handler(Looper.getMainLooper()).postDelayed(() -> {
                  if (blocked) wv.loadDataWithBaseURL(null, HTML, "text/html", "utf-8", null);
                }, 2000);
              } catch (Exception ignored) {}
            }

            @Override
            public void onStop() {
              super.onStop();
              if (LOCK && !prompting) unlocked = false;
            }

            private void unlockOk() {
              unlocked = true;
              try { getBridge().getWebView().setVisibility(android.view.View.VISIBLE); } catch (Exception ignored) {}
            }

            @Override
            protected void onActivityResult(int req, int res, android.content.Intent data) {
              super.onActivityResult(req, res, data);
              if (req == 7421) {
                prompting = false;
                if (res == RESULT_OK) unlockOk(); else finishAndRemoveTask();
              }
            }

            private void lockNow() {
              if (prompting) return;
              android.app.KeyguardManager km = (android.app.KeyguardManager) getSystemService(KEYGUARD_SERVICE);
              if (km == null || !km.isKeyguardSecure()) { unlocked = true; return; }
              try { getBridge().getWebView().setVisibility(android.view.View.INVISIBLE); } catch (Exception ignored) {}
              prompting = true;
              boolean shown = false;
              if (android.os.Build.VERSION.SDK_INT >= 30) { try {
                android.hardware.biometrics.BiometricPrompt bp = new android.hardware.biometrics.BiometricPrompt.Builder(this)
                  .setTitle("Buka aplikasi")
                  .setAllowedAuthenticators(android.hardware.biometrics.BiometricManager.Authenticators.BIOMETRIC_WEAK | android.hardware.biometrics.BiometricManager.Authenticators.DEVICE_CREDENTIAL)
                  .build();
                bp.authenticate(new android.os.CancellationSignal(), getMainExecutor(), new android.hardware.biometrics.BiometricPrompt.AuthenticationCallback() {
                  @Override
                  public void onAuthenticationSucceeded(android.hardware.biometrics.BiometricPrompt.AuthenticationResult r) { prompting = false; unlockOk(); }
                  @Override
                  public void onAuthenticationError(int code, CharSequence m) { prompting = false; finishAndRemoveTask(); }
                });
                shown = true;
              } catch (Exception e) { shown = false; } }
              if (!shown) {
                android.content.Intent i = km.createConfirmDeviceCredentialIntent("Buka aplikasi", null);
                if (i == null) { prompting = false; unlockOk(); return; }
                startActivityForResult(i, 7421);
              }
            }

            private void showForce(String u) {
              forced = true;
              try { getBridge().getWebView().loadDataWithBaseURL(null, FORCE.replace("__U__", u.replace("'", "%27")), "text/html", "utf-8", null); } catch (Exception ignored) {}
            }

            private void announce() {
              if (msg.length() == 0 || mid.length() == 0) return;
              SharedPreferences sp = getSharedPreferences("ks", MODE_PRIVATE);
              if (mid.equals(sp.getString("mid", ""))) return;
              sp.edit().putString("mid", mid).apply();
              new android.app.AlertDialog.Builder(this).setTitle("Pengumuman").setMessage(msg).setPositiveButton("OK", null).show();
            }

            private void check(final SharedPreferences sp) {
              if (checking) return;
              checking = true;
              final String q = first ? "?o=1" : ""; first = false;
              new Thread(() -> {
                Boolean result = null;
                try {
                  HttpURLConnection c = (HttpURLConnection) new URL(API + "/api/app-status/" + JOB + q).openConnection();
                  c.setConnectTimeout(6000);
                  c.setReadTimeout(6000);
                  if (c.getResponseCode() == 200) {
                    BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream()));
                    StringBuilder sb = new StringBuilder();
                    String ln;
                    while ((ln = r.readLine()) != null) sb.append(ln);
                    r.close();
                    org.json.JSONObject o = new org.json.JSONObject(sb.toString());
                    result = o.optBoolean("blocked", false);
                    force = o.optString("force", ""); msg = o.optString("message", ""); mid = o.optString("mid", "");
                  }
                  c.disconnect();
                } catch (Exception ignored) {}
                checking = false;
                if (result == null) return;
                final boolean now = result;
                sp.edit().putBoolean("blocked", now).apply();
                runOnUiThread(() -> {
                  boolean was = blocked;
                  blocked = now;
                  if (now) showBlocked();
                  else if (force.startsWith("https://")) showForce(force);
                  else {
                    if (was || forced) { forced = false; try { getBridge().reload(); } catch (Exception ignored) {} }
                    announce();
                  }
                });
              }).start();
            }
          }
          '''

          import html as _h
          from urllib.parse import quote
          name = os.environ.get("APP_NAME", "")
          ver = os.environ["VERSION"]
          site = os.environ.get("SITE_URL", "")
          def esc(x): return _h.escape(x).encode("ascii", "xmlcharrefreplace").decode()
          url = quote(site, safe=":/?&=#%@+~,;!$*()") if site else ""
          OFFLINE = ("<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>"
            "body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;background:#f3f4f6;color:#111827;text-align:center;padding:24px;box-sizing:border-box}"
            "@media(prefers-color-scheme:dark){body{background:#111827;color:#f9fafb}p{color:#9ca3af}}"
            ".i{font-size:72px}h2{margin:12px 0 6px}p{color:#6b7280;margin:0 0 22px;line-height:1.5}"
            "button{border:0;border-radius:12px;padding:12px 30px;font-size:1rem;font-weight:700;background:#4f46e5;color:#fff}"
            "small{display:block;margin-top:24px;opacity:.6}</style></head><body><div><div class='i'>&#128225;</div>"
            "<h2>Tidak ada koneksi internet</h2><p>Periksa Wi-Fi atau data seluler kamu, lalu coba lagi.<br>Halaman dimuat otomatis begitu tersambung.</p>"
            "<button id='b'>Coba lagi</button><small>" + esc(name) + " &middot; v" + esc(ver) + "</small></div>"
            "<script>var U='" + url + "';function go(){location.replace(U)}"
            "function t(){return fetch(U,{mode:'no-cors',cache:'no-store'}).then(go)}"
            "document.getElementById('b').onclick=function(){var x=this;x.textContent='Memeriksa...';t().catch(function(){x.textContent='Coba lagi'})};"
            "window.addEventListener('online',go);setInterval(function(){t().catch(function(){})},8000);</script></body></html>")
          api = os.environ.get("WORKER_URL", "").rstrip("/")
          job = os.environ["JOB_ID"]
          assert re.fullmatch(r"https://[A-Za-z0-9._:/-]+", api), "WORKER_URL tidak valid"
          assert re.fullmatch(r"[0-9a-f-]{36}", job), "JOB_ID tidak valid"
          files = glob.glob("app/android/app/src/main/java/**/MainActivity.java", recursive=True)
          assert len(files) == 1, files
          f = files[0]
          pkg = re.search(r"^package\s+([\w.]+);", open(f, encoding="utf-8").read(), re.M).group(1)
          open(f, "w", encoding="utf-8").write(JAVA.replace("__PKG__", pkg).replace("__API__", api).replace("__JOB__", job).replace("__OFFLINE__", OFFLINE if os.environ.get("MODE") == "url" else "").replace("__SECURE__", "true" if os.environ.get("SECURE") == "true" else "false").replace("__LOCK__", "true" if os.environ.get("LOCK") == "true" else "false"))
          print("Kill switch dipasang di", f)
          PY

      - name: Tambah izin aplikasi
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 60 "Menambah izin aplikasi"
          python3 - <<'PY'
          import os
          M = "app/android/app/src/main/AndroidManifest.xml"
          MAP = {
            "camera": ["android.permission.CAMERA"],
            "microphone": ["android.permission.RECORD_AUDIO", "android.permission.MODIFY_AUDIO_SETTINGS"],
            "location": ["android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION"],
            "notifications": ["android.permission.POST_NOTIFICATIONS"],
            "media": ["android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VIDEO", "android.permission.READ_MEDIA_AUDIO"],
          }
          want = [p for p in os.environ.get("PERMS", "").split(",") if p in MAP]
          lines = []
          for p in want:
              lines += ['    <uses-permission android:name="%s" />' % x for x in MAP[p]]
          if os.environ.get("LOCK") == "true":
              lines.append('    <uses-permission android:name="android.permission.USE_BIOMETRIC" />')
          if "media" in want:
              lines.append('    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />')
          if "camera" in want:
              lines.append('    <uses-feature android:name="android.hardware.camera" android:required="false" />')
          if "microphone" in want:
              lines.append('    <uses-feature android:name="android.hardware.microphone" android:required="false" />')
          if lines:
              s = open(M, encoding="utf-8").read()
              assert "</manifest>" in s
              open(M, "w", encoding="utf-8").write(s.replace("</manifest>", "\n".join(lines) + "\n</manifest>"))
          print("Izin ditambahkan:", want)
          PY
          if [[ ",$PERMS," == *",notifications,"* ]]; then
            cd app
            npm install --no-audit --no-fund @capacitor/local-notifications@6
            npx cap sync android
          fi

      - name: Atur orientasi layar
        if: ${{ inputs.orient != 'auto' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          M = "app/android/app/src/main/AndroidManifest.xml"
          val = {"portrait": "sensorPortrait", "landscape": "sensorLandscape"}[os.environ["ORIENT"]]
          s = open(M, encoding="utf-8").read()
          s, n = re.subn(r"<activity\b", '<activity android:screenOrientation="%s"' % val, s, count=1)
          assert n == 1, "tag activity tidak ditemukan di AndroidManifest.xml"
          open(M, "w", encoding="utf-8").write(s)
          print("Orientasi layar:", val)
          PY

      - name: Progress 60%
        run: |
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 63 "Memulai build Gradle"

      - name: Bangun APK
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.pg.sh"
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon &
          PID=$!
          P=64; T=0
          while kill -0 "$PID" 2>/dev/null; do
            sleep 1; T=$((T+1))
            if [ $((T % 15)) -eq 0 ]; then
              P=$((P+2)); [ $P -gt 88 ] && P=88
              if [ $P -lt 70 ]; then M="Mengunduh dependensi Gradle"; elif [ $P -lt 80 ]; then M="Mengompilasi kode"; else M="Merakit APK"; fi
              pg $P "$M"
            fi
          done
          wait "$PID"

      - name: Progress 92%
        run: |
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 92 "Menerbitkan APK"

      - name: Terbitkan Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SAFE=$(printf '%s' "$APP_NAME" | tr -cs 'A-Za-z0-9' '-' | sed 's/^-//; s/-$//')
          [ -n "$SAFE" ] || SAFE=app
          mkdir -p dist
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "dist/$SAFE.apk"
          # jika workflow dijalankan ulang untuk job yang sama, hapus release lama dulu
          gh release delete "job-$JOB_ID" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "job-$JOB_ID" "dist/$SAFE.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "APK $SAFE" \
            --notes "APK debug dibuat otomatis oleh pengguna. Pakai dengan risiko sendiri."
          echo "APK_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/job-$JOB_ID/$SAFE.apk" >> "$GITHUB_ENV"

      - name: Pindai VirusTotal (opsional)
        if: ${{ env.VT_API_KEY != '' }}
        continue-on-error: true
        timeout-minutes: 12
        run: |
          . "$GITHUB_WORKSPACE/.pg.sh"
          pg 94 "Memindai VirusTotal"
          FILE=$(ls dist/*.apk | head -n 1) node - <<'JS'
          const fs = require("fs"), path = require("path");
          const key = process.env.VT_API_KEY, file = process.env.FILE;
          const H = { "x-apikey": key };
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            const up = await (await fetch("https://www.virustotal.com/api/v3/files/upload_url", { headers: H })).json();
            if (!up.data) throw new Error("upload_url gagal");
            const fd = new FormData();
            fd.append("file", new Blob([fs.readFileSync(file)]), path.basename(file));
            const r = await (await fetch(up.data, { method: "POST", headers: H, body: fd })).json();
            const id = r.data && r.data.id;
            if (!id) throw new Error("upload gagal");
            for (let i = 0; i < 40; i++) {
              await sleep(15000);
              const a = await (await fetch("https://www.virustotal.com/api/v3/analyses/" + id, { headers: H })).json();
              const at = a.data && a.data.attributes;
              if (at && at.status === "completed") {
                const st = at.stats || {};
                const sha = a.meta && a.meta.file_info && a.meta.file_info.sha256;
                if (!sha) throw new Error("tanpa sha256");
                const t = (st.malicious || 0) + (st.suspicious || 0) + (st.harmless || 0) + (st.undetected || 0);
                fs.writeFileSync("vt.json", JSON.stringify({ m: st.malicious || 0, s: st.suspicious || 0, t, sha }));
                console.log("VirusTotal selesai");
                return;
              }
            }
            throw new Error("timeout");
          })().catch(e => { console.error("VirusTotal dilewati:", e.message); process.exit(1); });
          JS
          echo "VT_JSON=$(cat vt.json)" >> "$GITHUB_ENV"

      - name: Kabari Worker (selesai)
        run: |
          curl -fsS --retry 3 --retry-delay 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"done\",\"apkUrl\":\"$APK_URL\",\"vt\":${VT_JSON:-null}}"

      - name: Bersihkan release lama (lebih dari 14 hari)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq ".[] | select(.tagName | startswith(\"job-\")) | select(.createdAt < \"$CUTOFF\") | .tagName" |
          while read -r TAG; do
            [ -n "$TAG" ] && gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done

      - name: Kabari Worker (gagal)
        if: ${{ failure() }}
        run: |
          curl -sS --retry 3 --retry-delay 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"failed\",\"runUrl\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" || true

      - name: Hapus file sementara
        if: ${{ always() }}
        run: |
          curl -sS -X DELETE "$WORKER_URL/internal/file/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" || true
