name: Build Crosshair Overlay EXE (Windows)
run-name: Build Crosshair Overlay EXE ${{ inputs.version || 'cek-build' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi aplikasi, contoh 1.0.1 (wajib dinaikkan tiap rilis supaya aplikasi pengguna otomatis menawarkan update)"
        required: true
        type: string
      changelog:
        description: "Catatan pembaruan yang akan tampil di pop-up update"
        required: false
        type: string
        default: "Perbaikan dan peningkatan kecil."
  push:
    branches: [main]
    paths:
      - "crosshair-windows/**"
      - ".github/workflows/build-crosshair-windows.yml"

permissions:
  contents: write

concurrency:
  group: build-crosshair-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      VERSION: ${{ inputs.version || '0.0.1' }}
      CHANGELOG: ${{ inputs.changelog }}
      GH_TOKEN: ${{ github.token }}
    
    steps:
      - name: Unduh kode repositori
        uses: actions/checkout@v4

      - name: Cek format versi
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] || { echo "::error::Format versi harus x.y.z, contoh 1.0.1"; exit 1; }

      - name: Terapkan nomor versi ke proyek
        shell: bash
        run: |
          FILE_PATH=$(find . -name "UpdateChecker.cs" -print -quit)
          if [ -z "$FILE_PATH" ]; then
            echo "::error::File UpdateChecker.cs tidak ditemukan di repositori!"
            exit 1
          fi
          echo "Mengubah file versi di: $FILE_PATH"
          sed -i 's/CurrentVersion = ".*";/CurrentVersion = "'"$VERSION"'";/' "$FILE_PATH"
          grep -n "CurrentVersion" "$FILE_PATH"

      - name: Setup .NET Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish EXE mandiri (satu file, tanpa perlu install .NET)
        shell: bash
        run: |
          CSPROJ_PATH=$(find . -name "*.csproj" -print -quit)
          if [ -z "$CSPROJ_PATH" ]; then
            echo "::error::File .csproj tidak ditemukan!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$CSPROJ_PATH")
          echo "Membangun proyek di: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          dotnet publish $(basename "$CSPROJ_PATH") -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Ganti nama EXE agar jelas versinya
        shell: bash
        run: |
          CSPROJ_PATH=$(find . -name "*.csproj" -print -quit)
          PROJECT_DIR=$(dirname "$CSPROJ_PATH")
          cd "$PROJECT_DIR"
          mkdir -p dist
          
          # Mencari file .exe apa saja secara otomatis di dalam folder publish
          EXE_FILE=$(find publish -name "*.exe" -print -quit)
          if [ -z "$EXE_FILE" ]; then
            echo "::error::Tidak ada file .exe yang ditemukan di folder publish!"
            exit 1
          fi
          echo "Menemukan file hasil build: $EXE_FILE"
          cp "$EXE_FILE" "dist/CrosshairOverlay-${VERSION}.exe"

      - name: Unggah EXE sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosshair-overlay-windows-exe
          path: "**/dist/CrosshairOverlay-${{ env.VERSION }}.exe"
          retention-days: 14

      - name: Buat GitHub Release untuk versi ini
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: crosshair-win-v${{ inputs.version }}
          name: Crosshair Overlay Windows v${{ inputs.version }}
          body: ${{ inputs.changelog }}
          files: "**/dist/CrosshairOverlay-${{ inputs.version }}.exe"
          make_latest: "false"

      - name: Perbarui rilis crosshair-win-latest (dibaca fitur update otomatis di aplikasi)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          CSPROJ_PATH=$(find . -name "*.csproj" -print -quit)
          PROJECT_DIR=$(dirname "$CSPROJ_PATH")
          cd "$PROJECT_DIR"
          gh release delete crosshair-win-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create crosshair-win-latest "dist/CrosshairOverlay-${VERSION}.exe" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Crosshair Overlay Windows (terbaru: v${VERSION})" --notes "${CHANGELOG:-Pembaruan tersedia.}" --latest=false
