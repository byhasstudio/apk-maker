name: Build Crosshair Overlay APK
run-name: Build Crosshair Overlay APK ${{ inputs.version || 'cek-build' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi aplikasi, contoh 1.0.1 (wajib dinaikkan tiap rilis supaya aplikasi di HP pengguna otomatis menawarkan update)"
        required: true
        type: string
      changelog:
        description: "Catatan pembaruan yang akan tampil di pop-up update"
        required: false
        type: string
        default: "Perbaikan dan peningkatan kecil."
  # Tiap ada perubahan kode crosshair di main, build otomatis jalan sebagai cek kompilasi
  # (hanya artifact, tanpa rilis). Rilis resmi hanya dibuat lewat tombol Run workflow.
  push:
    branches: [main]
    paths:
      - "crosshair-overlay/**"
      - ".github/workflows/build-crosshair.yml"

permissions:
  contents: write

concurrency:
  group: build-crosshair
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERSION: ${{ inputs.version || '0.0.1' }}
      CHANGELOG: ${{ inputs.changelog }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: crosshair-overlay
    steps:
      - uses: actions/checkout@v4

      - name: Cek format versi
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Format versi harus x.y.z, contoh 1.0.1"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pakai keystore debug yang sama di setiap build (supaya update bisa menimpa versi lama)
        run: cp ../remote-control/app/debug.keystore app/debug.keystore

      - name: Terapkan nomor versi ke proyek
        run: |
          set -euo pipefail
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          sed -i "s/versionCode = .*/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          grep -n "version" app/build.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Ganti nama APK agar jelas versinya
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Crosshair-${VERSION}.apk"

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosshair-overlay-apk
          path: crosshair-overlay/dist/Crosshair-${{ env.VERSION }}.apk
          retention-days: 14

      - name: Buat GitHub Release untuk versi ini
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: crosshair-v${{ inputs.version }}
          name: Crosshair Overlay v${{ inputs.version }}
          body: ${{ inputs.changelog }}
          files: crosshair-overlay/dist/Crosshair-${{ inputs.version }}.apk
          make_latest: "false"

      - name: Perbarui rilis crosshair-latest (dibaca fitur update otomatis di aplikasi)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          gh release delete crosshair-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create crosshair-latest "dist/Crosshair-${VERSION}.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Crosshair Overlay (terbaru: v${VERSION})" \
            --notes "${CHANGELOG:-Pembaruan tersedia.}" \
            --latest=false
