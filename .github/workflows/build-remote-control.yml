name: Build Remote Control APK
run-name: Build Remote Control APK ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi aplikasi, contoh 0.2.0 (wajib dinaikkan tiap kali mau pengguna lama dapat notifikasi update)"
        required: true
        type: string
      changelog:
        description: "Catatan pembaruan yang akan tampil di pop-up update pengguna"
        required: false
        type: string
        default: "Perbaikan dan peningkatan kecil."

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: remote-control
    steps:
      - uses: actions/checkout@v4

      - name: Cek format versi
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Format versi harus x.y.z, contoh 0.2.0"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.REMOTECTL_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "::error::Secret REMOTECTL_GOOGLE_SERVICES_JSON belum diisi. Lihat remote-control/README.md."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Isi Web Client ID buat Login Google (opsional)
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.REMOTECTL_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_WEB_CLIENT_ID:-}" ]; then
            sed -i "s/ISI_WEB_CLIENT_ID_DARI_FIREBASE_CONSOLE/${GOOGLE_WEB_CLIENT_ID}/" \
              app/src/main/java/com/byhasstudio/remotectl/LoginActivity.kt
          else
            echo "::warning::Secret REMOTECTL_GOOGLE_WEB_CLIENT_ID belum diisi -- tombol 'Masuk dengan Google' akan gagal sampai diisi. Lihat README bagian 'Login Google'."
          fi

      - name: Terapkan nomor versi ke proyek
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          sed -i "s/versionCode = .*/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK debug
        run: gradle :app:assembleDebug --no-daemon

      - name: Ganti nama APK agar jelas versinya
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/RemoteCtl-${{ inputs.version }}.apk"

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-ctl-debug-apk
          path: remote-control/dist/RemoteCtl-${{ inputs.version }}.apk
          retention-days: 14

      - name: Buat GitHub Release (sumber info update otomatis)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ inputs.version }}
          name: Remote Ctl Android v${{ inputs.version }}
          body: ${{ inputs.changelog }}
          files: remote-control/dist/RemoteCtl-${{ inputs.version }}.apk
