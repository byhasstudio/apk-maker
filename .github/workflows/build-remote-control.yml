name: Build Remote Control APK
run-name: Build Remote Control APK

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: remote-control
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.REMOTECTL_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "::error::Secret REMOTECTL_GOOGLE_SERVICES_JSON belum diisi. Lihat remote-control/README.md."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK debug
        run: gradle :app:assembleDebug --no-daemon

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-ctl-debug-apk
          path: remote-control/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
