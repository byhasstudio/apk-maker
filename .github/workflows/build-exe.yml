          "use strict";
          // Modul efek Windows: Dynamic Island (membaca notifikasi Windows) + animasi buka/tutup jendela ala iOS.
          // Dipakai oleh main.js lewat: const fx = require("./fx/fx.js"); fx.start({ app, win, cfg });
          const { app, BrowserWindow, screen, ipcMain, shell, nativeImage, clipboard, globalShortcut } = require("electron");
          const fs = require("fs");
          const path = require("path");
          const { spawn, execFile } = require("child_process");
          const { fileURLToPath, pathToFileURL } = require("url");

          const DEF = {
            enabled: false, anim: false, animmin: true, pill: true,
            bg: "#000000", op: 100, dy: 0, cw: 110, ew: 340, cx: 0, dh: 0,
            fmode: 0, fapps: [], snd: false, dur: 4500, tapopen: true, suri: "", svol: 100, seen: {},
            edge: "top", bat: true, clip: false, glow: true, dnd: false, qon: false, qfrom: "22:00", qto: "07:00", hot: true, mon: "primary", hist: true,
            appnotif: true, live: true, media: true, devs: true, net: true, rmon: 1, prog: true, hub: true, game: true,
            curs: false, cstyle: "ring", ccolor: "#ffffff", csize: 36
          };

          let ctx = null, S = Object.assign({}, DEF), started = false, quitting = false;
          let isl = null, islReady = false, islPend = [];
          const anims = new Map();            // id layar -> { win, ready, pend }
          const procs = { notif: null, win: null, sys: null };
          let notifState = { ok: false, err: "" }, notifTries = 0;
          const appNames = new Map(), iconCache = new Map(), iconBusy = new Map();
          let startApps = [], appsReady = false, saveT = null, ownIcon = "";
          let hist = [], histT = null, clipLast = null, clipT = null, topT = null;

          /* ---------- penyimpanan ---------- */
          const storeFile = () => path.join(app.getPath("userData"), "island.json");
          function load() {
            let had = false;
            try { const j = JSON.parse(fs.readFileSync(storeFile(), "utf8")); S = Object.assign({}, DEF, j); had = true; } catch (_) { S = Object.assign({}, DEF); }
            // mode URL tidak punya halaman pengaturan: nyalakan langsung
            if (!had && ctx && ctx.cfg && ctx.cfg.url) { S.enabled = true; S.anim = true; }
            if (!Array.isArray(S.fapps)) S.fapps = [];
            if (!S.seen || typeof S.seen !== "object") S.seen = {};
          }
          function save() {
            clearTimeout(saveT);
            saveT = setTimeout(() => { try { fs.writeFileSync(storeFile(), JSON.stringify(S)); } catch (_) {} }, 250);
          }
          const clamp = (v, a, b) => Math.max(a, Math.min(b, Number(v) || 0));

          /* ---------- pembantu sistem (fxhelper.exe) ---------- */
          function helperExe() {
            return app.isPackaged ? path.join(process.resourcesPath, "fxhelper.exe") : path.join(__dirname, "bin", "fxhelper.exe");
          }
          function runHelper(args, onLine, onExit, exe) {
            const p = spawn(exe || helperExe(), args, { windowsHide: true, stdio: ["pipe", "pipe", "ignore"] });
            let buf = "";
            p.stdout.setEncoding("utf8");
            p.stdout.on("data", d => {
              buf += d;
              let i;
              while ((i = buf.indexOf("\n")) >= 0) {
                const l = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
                if (!l) continue;
                try { onLine(JSON.parse(l)); } catch (_) {}
              }
            });
            p.stdin.on("error", () => {});
            p.on("error", () => { onExit && onExit(-1); });
            p.on("exit", c => { onExit && onExit(c); });
            return p;
          }
          function killHelper(p) { if (!p) return; try { p.stdin.end(); } catch (_) {} try { p.kill(); } catch (_) {} }

          function appIcon(id, px) {
            if (!id) return Promise.resolve("");
            const k = id + "|" + px;
            if (iconCache.has(k)) return Promise.resolve(iconCache.get(k));
            if (iconBusy.has(k)) return iconBusy.get(k);
            const pr = new Promise(res => {
              try {
                execFile(helperExe(), ["icon", id, String(px)], { windowsHide: true, timeout: 6000, maxBuffer: 4 * 1024 * 1024, encoding: "utf8" }, (err, out) => {
                  const v = (!err && out && out.length > 40) ? "data:image/png;base64," + String(out).trim() : "";
                  iconCache.set(k, v); iconBusy.delete(k); res(v);
                });
              } catch (_) { iconBusy.delete(k); res(""); }
            });
            iconBusy.set(k, pr);
            return pr;
          }
          const wait = (ms, v) => new Promise(r => setTimeout(() => r(v), ms));

          function refreshApps() {
            const ps = "[Console]::OutputEncoding=[Text.Encoding]::UTF8; Get-StartApps | ForEach-Object { $_.AppID + [char]9 + $_.Name }";
            try {
              execFile("powershell.exe", ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-Command", ps],
                { windowsHide: true, timeout: 40000, maxBuffer: 16 * 1024 * 1024, encoding: "utf8" }, (err, out) => {
                  const list = [], seen = new Set();
                  if (!err && out) {
                    String(out).split(/\r?\n/).forEach(l => {
                      const i = l.indexOf("\t");
                      if (i <= 0) return;
                      const id = l.slice(0, i).trim(), name = l.slice(i + 1).trim();
                      if (!id || !name || seen.has(id)) return;
                      seen.add(id); list.push({ n: name, p: id }); appNames.set(id, name);
                    });
                  }
                  startApps = list; appsReady = true;
                });
            } catch (_) { appsReady = true; }
          }

          function prettyApp(id) {
            if (!id) return "Windows";
            const n = appNames.get(id) || (S.seen && S.seen[id]);
            if (n) return n;
            let s = String(id);
            if (/^[a-z]:[\\/]/i.test(s) || /\.exe$/i.test(s)) s = path.basename(s).replace(/\.exe$/i, "");
            else if (s.indexOf("!") >= 0) { s = s.split("!")[0].split("_")[0].split(".").pop(); }
            else if (s.indexOf(".") >= 0) s = s.split(".").pop();
            s = s.replace(/[_-]+/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").trim();
            return s ? s.charAt(0).toUpperCase() + s.slice(1) : "Windows";
          }

          /* ---------- suara ---------- */
          const mediaDir = () => path.join(process.env.WINDIR || "C:\\Windows", "Media");
          function soundList() {
            const out = [];
            try {
              fs.readdirSync(mediaDir()).forEach(f => {
                if (!/\.wav$/i.test(f)) return;
                let sz = 0; try { sz = fs.statSync(path.join(mediaDir(), f)).size; } catch (_) {}
                if (sz > 700 * 1024) return;
                out.push({ t: f.replace(/\.wav$/i, ""), u: pathToFileURL(path.join(mediaDir(), f)).href });
              });
            } catch (_) {}
            out.sort((a, b) => a.t.localeCompare(b.t));
            return out;
          }
          function defaultSoundUrl() {
            const f = path.join(mediaDir(), "Windows Notify System Generic.wav");
            if (fs.existsSync(f)) return pathToFileURL(f).href;
            const l = soundList();
            return l.length ? l[0].u : "";
          }
          const soundUrl = u => (u && String(u).length ? u : defaultSoundUrl());

          /* ---------- jendela island ---------- */
          function islDisplay() {
            try { if (S.mon === "cursor") return screen.getDisplayNearestPoint(screen.getCursorScreenPoint()); } catch (_) {}
            return screen.getPrimaryDisplay();
          }
          function islandBounds() {
            const d = islDisplay();
            const b = d.bounds, ew = Math.min(S.ew, b.width - 40), mg = Math.max(0, S.dy), side = S.edge === "left" || S.edge === "right";
            const W = ew + 100 + (side ? mg : 0), H = (side ? Math.max(320, S.cw + 80) : 300) + (side ? 0 : mg);
            const along = (len, box, org) => Math.round(Math.max(org, Math.min(org + box - len, org + (box - len) / 2 + S.cx)));
            if (S.edge === "bottom") return { x: along(W, b.width, b.x), y: b.y + b.height - H, width: W, height: H };
            if (S.edge === "left") return { x: b.x, y: along(H, b.height, b.y), width: W, height: H };
            if (S.edge === "right") return { x: b.x + b.width - W, y: along(H, b.height, b.y), width: W, height: H };
            return { x: along(W, b.width, b.x), y: b.y, width: W, height: H };
          }
          function overlayPrefs() {
            return { preload: path.join(__dirname, "overlay-preload.js"), contextIsolation: true, sandbox: true, nodeIntegration: false, backgroundThrottling: false, autoplayPolicy: "no-user-gesture-required" };
          }
          function overlayOpts(b) {
            return Object.assign({}, b, {
              frame: false, transparent: true, resizable: false, movable: false, minimizable: false, maximizable: false, fullscreenable: false,
              focusable: false, skipTaskbar: true, alwaysOnTop: true, hasShadow: false, show: false, backgroundColor: "#00000000", webPreferences: overlayPrefs()
            });
          }
          function islCfg() {
            return { bg: S.bg, op: S.op, cw: S.cw, ew: S.ew, dh: S.dh, top: 8 + S.dy, edge: S.edge, always: !!S.pill, dur: S.dur, glow: !!S.glow, bat: !!S.bat, snd: !!S.snd, surl: soundUrl(S.suri), svol: S.svol };
          }
          function ensureIsland() {
            if (isl && !isl.isDestroyed()) return isl;
            isl = new BrowserWindow(overlayOpts(islandBounds()));
            islReady = false; islPend = [];
            isl.setAlwaysOnTop(true, "screen-saver");
            isl.setIgnoreMouseEvents(true, { forward: true });
            isl.webContents.once("did-finish-load", () => {
              islReady = true;
              isl.webContents.send("fx:cfg", islCfg());
              islPend.forEach(m => isl.webContents.send("fx:" + m[0], m[1]));
              islPend = [];
              if (S.pill && S.enabled) { try { isl.showInactive(); } catch (_) {} }
            });
            isl.on("closed", () => { isl = null; islReady = false; });
            // kalau ada yang menyembunyikannya (bukan kita), munculkan lagi: island tidak boleh hilang sampai dimatikan
            isl.on("hide", () => { setTimeout(() => { if (S.enabled && S.pill && isl && !isl.isDestroyed() && !isl.isVisible()) { try { isl.showInactive(); } catch (_) {} } }, 250); });
            isl.loadFile(path.join(__dirname, "island.html"));
            return isl;
          }
          function toIsl(ch, d) {
            const w = ensureIsland();
            if (islReady) w.webContents.send("fx:" + ch, d); else islPend.push([ch, d]);
          }
          function placeIsland() {
            if (!isl || isl.isDestroyed()) return;
            try { isl.setBounds(islandBounds()); } catch (_) {}
          }
          function sendCfg() {
            if (!isl || isl.isDestroyed()) return;
            placeIsland();
            if (islReady) isl.webContents.send("fx:cfg", islCfg());
            if (S.pill && S.enabled) { try { isl.showInactive(); } catch (_) {} }
          }
          function showIsland(p) {
            if (!S.enabled) return;
            const w = ensureIsland();
            placeIsland();
            try { w.setAlwaysOnTop(true, "screen-saver"); if (!w.isVisible()) w.showInactive(); } catch (_) {}
            toIsl("show", p);
          }
          // Aplikasi layar penuh bisa mendorong dirinya ke atas: tegaskan lagi posisi paling atas secara berkala.
          function keepTop() {
            if (topT) return;
            topT = setInterval(() => {
              if (!S.enabled || !isl || isl.isDestroyed()) return;
              try {
                isl.setAlwaysOnTop(true, "screen-saver");
                if (S.pill && !isl.isVisible()) isl.showInactive();
                if (isl.isVisible()) isl.moveTop();
              } catch (_) {}
            }, 1200);
          }
          function stopTop() { if (topT) { clearInterval(topT); topT = null; } }
          function destroyIsland() {
            if (isl && !isl.isDestroyed()) { try { isl.destroy(); } catch (_) {} }
            isl = null; islReady = false; islPend = [];
          }

          /* ---------- notifikasi Windows ---------- */
          function readImg(p) {
            try {
              if (!p) return "";
              if (/^file:/i.test(p)) p = fileURLToPath(p);
              else if (/^[a-z][a-z0-9+.-]*:/i.test(p) && !/^[a-z]:[\\/]/i.test(p)) return "";
              if (!fs.existsSync(p) || fs.statSync(p).size > 3 * 1024 * 1024) return "";
              const ni = nativeImage.createFromPath(p);
              if (ni.isEmpty()) return "";
              const s = ni.getSize(), k = 128 / Math.max(s.width, s.height);
              return (k < 1 ? ni.resize({ width: Math.max(1, Math.round(s.width * k)), height: Math.max(1, Math.round(s.height * k)) }) : ni).toDataURL();
            } catch (_) { return ""; }
          }
          async function onToast(m) {
            if (!S.enabled) return;
            const id = String(m.app || "");
            if (S.fmode === 1 && S.fapps.indexOf(id) < 0) return;
            const label = prettyApp(id);
            if (id && S.seen[id] !== label) {
              S.seen[id] = label;
              const ks = Object.keys(S.seen);
              if (ks.length > 80) delete S.seen[ks[0]];
              save();
            }
            if (S.hist) addHist({ title: m.title || label, text: m.body || "", app: label, appId: id });
            if (quiet()) return;
            const img = readImg(m.img);
            const icon = await Promise.race([appIcon(id, 64), wait(700, "")]);
            showIsland({ title: m.title || label, text: m.body || "", img: img, icon: icon, app: label, appId: id });
          }
          function startNotif() {
            if (procs.notif || !S.enabled) return;
            if (!fs.existsSync(helperExe())) { notifState = { ok: false, err: "fxhelper.exe tidak ditemukan" }; return; }
            procs.notif = runHelper(["notif"], m => {
              if (m.t === "ready") { notifState = { ok: true, err: "" }; notifTries = 0; }
              else if (m.t === "err") notifState = { ok: false, err: String(m.m || "") };
              else if (m.t === "toast") onToast(m);
            }, () => {
              procs.notif = null; notifState = { ok: false, err: notifState.err || "pembaca berhenti" };
              if (S.enabled && !quitting && notifTries++ < 5) setTimeout(startNotif, 2500);
            });
          }
          function stopNotif() { const p = procs.notif; procs.notif = null; killHelper(p); notifState = { ok: false, err: "" }; }

          function openApp(id) {
            if (!id || !appNames.has(id)) return;
            try { spawn("explorer.exe", ["shell:AppsFolder\\" + id], { detached: true, stdio: "ignore", windowsHide: true }).unref(); } catch (_) {}
          }

          /* ---------- animasi buka/tutup jendela ---------- */
          // Jendela overlay dibuat di depan lalu "diparkir" di luar layar (bukan disembunyikan), supaya tidak ada jeda
          // menampilkan/menggambar ulang saat animasi dimulai. Itu sumber utama delay sebelumnya.
          const PARK = -32000;
          function park(o) { try { if (!o.win.isDestroyed()) o.win.setPosition(PARK, PARK, false); } catch (_) {} }
          function animFor(d) {
            let o = anims.get(d.id);
            if (o && !o.win.isDestroyed()) return o;
            const win = new BrowserWindow(overlayOpts({ x: PARK, y: PARK, width: d.bounds.width, height: d.bounds.height }));
            o = { win: win, ready: false, pend: [], shown: false };
            win.setAlwaysOnTop(true, "screen-saver");
            win.setIgnoreMouseEvents(true);
            win.webContents.once("did-finish-load", () => {
              o.ready = true;
              try { win.setPosition(PARK, PARK, false); win.showInactive(); o.shown = true; } catch (_) {}
              o.pend.forEach(x => animPlace(o, x.d, x.m)); o.pend = [];
            });
            win.on("closed", () => { if (anims.get(d.id) === o) anims.delete(d.id); });
            win.loadFile(path.join(__dirname, "anim.html"));
            anims.set(d.id, o);
            return o;
          }
          function taskbarOrigin(d, r) {
            const b = d.bounds, w = d.workArea;
            const gb = (b.y + b.height) - (w.y + w.height), gt = w.y - b.y, gl = w.x - b.x, gr = (b.x + b.width) - (w.x + w.width);
            const m = Math.max(gb, gt, gl, gr);
            const mid = b.x + b.width / 2;
            const cx = Math.min(Math.max(r.x + r.width / 2, mid - 260), mid + 260);
            if (m < 8) return { x: cx, y: b.y + b.height - 28 };
            if (m === gb) return { x: cx, y: b.y + b.height - gb / 2 };
            if (m === gt) return { x: cx, y: b.y + gt / 2 };
            if (m === gl) return { x: b.x + gl / 2, y: r.y + r.height / 2 };
            return { x: b.x + b.width - gr / 2, y: r.y + r.height / 2 };
          }
          function animPlace(o, d, msg) {
            try {
              const b = o.win.getBounds();
              if (b.width !== d.bounds.width || b.height !== d.bounds.height) o.win.setBounds(d.bounds);
              else if (b.x !== d.bounds.x || b.y !== d.bounds.y) o.win.setPosition(d.bounds.x, d.bounds.y, false);
              if (!o.shown) { o.win.setAlwaysOnTop(true, "screen-saver"); o.win.showInactive(); o.shown = true; }
              o.win.webContents.send("fx:play", msg);
            } catch (_) {}
          }
          function playAnim(opening, r, icon, max) {
            const d = screen.getDisplayMatching(r);
            const o = animFor(d);
            const org = taskbarOrigin(d, r);
            const msg = {
              opening: !!opening, max: !!max, icon: icon || "",
              rect: { x: r.x - d.bounds.x, y: r.y - d.bounds.y, w: r.width, h: r.height },
              origin: { x: org.x - d.bounds.x, y: org.y - d.bounds.y }
            };
            if (o.ready) animPlace(o, d, msg); else o.pend.push({ d: d, m: msg });
          }
          const winIcons = new Map(), appOpenAt = new Map();
          function exeIcon(exe) {
            if (!exe) return Promise.resolve("");
            if (winIcons.has(exe)) return Promise.resolve(winIcons.get(exe));
            return app.getFileIcon(exe, { size: "large" }).then(i => {
              const v = i.isEmpty() ? "" : i.toDataURL();
              if (winIcons.size > 120) winIcons.clear();
              if (v) winIcons.set(exe, v);
              return v;
            }).catch(() => "");
          }
          function appOpenToast(m) {
            if (!S.appnotif || !S.enabled || quiet()) return;
            const key = String(m.exe || m.name || "");
            const now = Date.now();
            if (now - (appOpenAt.get(key) || 0) < 5000) return;
            appOpenAt.set(key, now);
            if (appOpenAt.size > 200) appOpenAt.clear();
            const label = String(m.name || "").trim() || prettyApp(m.exe);
            const ico = m.icon ? "data:image/png;base64," + m.icon : (winIcons.get(m.exe) || "");
            showIsland({ title: label, text: "Aplikasi dibuka", app: label, appId: "", icon: ico, kind: "app", quiet: true, time: "baru saja" });
            if (!ico && m.exe) exeIcon(m.exe);
          }
          function onWin(m) {
            if (m.t === "open") appOpenToast(m);
            if (!S.anim) return;
            if ((m.t === "minimize" || m.t === "restore") && !S.animmin) return;
            const opening = m.t === "open" || m.t === "restore";
            const r = screen.screenToDipRect(null, { x: m.x, y: m.y, width: m.w, height: m.h });
            if (m.icon) { playAnim(opening, r, "data:image/png;base64," + m.icon, m.max); return; }
            if (!m.exe) { playAnim(opening, r, "", m.max); return; }
            if (winIcons.has(m.exe)) { playAnim(opening, r, winIcons.get(m.exe), m.max); return; }
            // ikon belum ada: tunggu paling lama 60 md, jangan menahan animasi
            Promise.race([exeIcon(m.exe), wait(60, "")]).then(d => playAnim(opening, r, d, m.max));
          }
          function startWin() {
            if (procs.win || !(S.anim || S.appnotif)) return;
            if (!fs.existsSync(helperExe())) return;
            procs.win = runHelper(["win", String(process.pid)], onWin, () => { procs.win = null; });
            // siapkan jendela overlay lebih awal supaya animasi pertama tidak tersendat
            if (S.anim) { try { screen.getAllDisplays().forEach(animFor); } catch (_) {} }
          }
          function stopWin() { const p = procs.win; procs.win = null; killHelper(p); }
          function demo() {
            const d = screen.getPrimaryDisplay(), w = Math.round(d.workArea.width * 0.55), h = Math.round(d.workArea.height * 0.6);
            const r = { x: d.workArea.x + Math.round((d.workArea.width - w) / 2), y: d.workArea.y + Math.round((d.workArea.height - h) / 2), width: w, height: h };
            playAnim(true, r, ownIcon, false);
            setTimeout(() => playAnim(false, r, ownIcon, false), 1900);
          }


          /* ---------- fitur pintar: jangan ganggu, riwayat, papan klip, tombol pintas ---------- */
          function svgIcon(color, glyph) {
            const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'><rect width='96' height='96' fill='" + color + "'/><text x='48' y='67' font-size='52' text-anchor='middle'>" + glyph + "</text></svg>";
            return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
          }
          function hm(s) { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || "")); return m ? (Math.min(23, +m[1]) * 60 + Math.min(59, +m[2])) : 0; }
          function quiet() {
            if (S.dnd) return true;
            if (!S.qon) return false;
            const n = new Date(), cur = n.getHours() * 60 + n.getMinutes(), a = hm(S.qfrom), b = hm(S.qto);
            if (a === b) return false;
            return a < b ? (cur >= a && cur < b) : (cur >= a || cur < b);
          }
          const histFile = () => path.join(app.getPath("userData"), "island-history.json");
          function loadHist() { try { const j = JSON.parse(fs.readFileSync(histFile(), "utf8")); hist = Array.isArray(j) ? j.slice(0, 40) : []; } catch (_) { hist = []; } }
          function saveHist() {
            clearTimeout(histT);
            histT = setTimeout(() => { try { fs.writeFileSync(histFile(), JSON.stringify(hist)); } catch (_) {} }, 600);
          }
          function addHist(h) {
            hist.unshift({ t: Date.now(), title: String(h.title || "").slice(0, 120), text: String(h.text || "").slice(0, 300), app: String(h.app || ""), appId: String(h.appId || "") });
            if (hist.length > 40) hist.length = 40;
            saveHist();
          }
          let clipSnap = null, clipSelf = 0;
          function clipChanged(fromSeq) {
            if (!S.enabled || !S.clip || Date.now() < clipSelf) return;
            let t = "";
            try { t = clipboard.readText(); } catch (_) {}
            if (t && t.trim()) {
              if (!fromSeq && t === clipLast) return;
              clipLast = t; clipSnap = { text: t };
              if (quiet()) return;
              showIsland({ title: "Disalin", text: t.replace(/\s+/g, " ").trim().slice(0, 90), app: "Papan klip", icon: svgIcon("#0a84ff", "📋"), appId: "", kind: "clip", time: "Ketuk: tempel", quiet: true });
              return;
            }
            let img = null;
            try { img = clipboard.readImage(); } catch (_) {}
            if (img && !img.isEmpty()) {
              const sz = img.getSize(), k = 112 / Math.max(sz.width, sz.height);
              const th = k < 1 ? img.resize({ width: Math.max(1, Math.round(sz.width * k)), height: Math.max(1, Math.round(sz.height * k)) }) : img;
              clipSnap = { image: img }; clipLast = "";
              if (quiet()) return;
              showIsland({ title: "Gambar disalin", text: sz.width + " \u00D7 " + sz.height + " px", img: th.toDataURL(), imgsq: true, app: "Papan klip", icon: svgIcon("#0a84ff", "🖼"), appId: "", kind: "clip", time: "Ketuk: tempel", quiet: true });
            }
          }
          // ketuk island = tempel isi papan klip ke aplikasi yang sedang aktif (island tidak mengambil fokus)
          function pasteClip() {
            if (!clipSnap) return;
            try {
              clipSelf = Date.now() + 900;
              if (clipSnap.text != null) { if (clipboard.readText() !== clipSnap.text) clipboard.writeText(clipSnap.text); }
              else if (clipSnap.image) clipboard.writeImage(clipSnap.image);
            } catch (_) {}
            setTimeout(() => {
              if (procs.sys && sysState.ok) sysCmd("paste");
              else { try { execFile("powershell.exe", ["-NoProfile", "-NonInteractive", "-Command", "Add-Type -AssemblyName System.Windows.Forms; [System.Windows.Forms.SendKeys]::SendWait('^v')"], { windowsHide: true }, () => {}); } catch (_) {} }
            }, 90);
          }
          function startClip() {
            if (clipT || !S.enabled || !S.clip) return;
            try { clipLast = clipboard.readText(); } catch (_) { clipLast = ""; }
            // cadangan kalau fxsys.exe tidak ada: cek teks tiap 700 md
            clipT = setInterval(() => {
              if (sysState.ok) return;
              let t = "";
              try { t = clipboard.readText(); } catch (_) { return; }
              if (t && t !== clipLast) clipChanged(false);
            }, 700);
          }
          function stopClip() { if (clipT) { clearInterval(clipT); clipT = null; } }
          function toggleDnd(on) {
            S.dnd = on === undefined ? !S.dnd : !!on; save();
            showIsland(S.dnd
              ? { title: "Jangan ganggu aktif", text: "Notifikasi tidak ditampilkan di island", app: "Dynamic Island", icon: svgIcon("#5e5ce6", "🌙"), appId: "" }
              : { title: "Jangan ganggu mati", text: "Notifikasi tampil lagi", app: "Dynamic Island", icon: svgIcon("#30d158", "🔔"), appId: "" });
          }
          function startKeys() {
            stopKeys();
            if (!S.enabled || !S.hot) return;
            try { globalShortcut.register("CommandOrControl+Alt+N", () => toggleDnd()); } catch (_) {}
            try { globalShortcut.register("CommandOrControl+Alt+I", () => { if (isl && !isl.isDestroyed() && islReady) isl.webContents.send("fx:stop", 1); }); } catch (_) {}
          }
          function stopKeys() {
            try { globalShortcut.unregister("CommandOrControl+Alt+N"); globalShortcut.unregister("CommandOrControl+Alt+I"); } catch (_) {}
          }

          /* ---------- pembantu tambahan (fxsys.exe): live activity, media, jaringan, monitor, progres, game, hub, kursor ---------- */
          const sysExe = () => app.isPackaged ? path.join(process.resourcesPath, "fxsys.exe") : path.join(__dirname, "bin", "fxsys.exe");
          function sysExists() { try { return fs.statSync(sysExe()).size > 2000; } catch (_) { return false; } }
          let sysState = { ok: false, err: "" }, sysTries = 0;
          const L = {};                      // aktivitas live yang sedang aktif (id -> data untuk island)
          let liveT = null;
          const netHist = [];
          let netHi = 0, netLo = 0, resHi = 0, resLo = 0, lag = false, lagAt = 0, lastTop = [], lastRes = { cpu: 0, ram: 0, gpu: -1 };
          let devPrev = { mic: [], cam: [], rec: [] };
          let mediaState = { play: false, app: "", title: "", artist: "" }, mediaWas = false, mediaToastAt = 0, mediaToastKey = "", mediaGone = null;
          let progState = { pct: -1, app: "", what: "", max: 0 };
          let gameState = { full: false, exe: "", fps: -1, ping: -1, jit: -1 };
          const pingHist = [];
          let hubItems = [], hubSeq = 1, hubArmed = false, hubDropPanel = false, hubDropAt = 0, dragTimer = null, pressInZone = false;

          const fromIsl = e => !!(isl && !isl.isDestroyed() && e.sender === isl.webContents);
          function sysCmd(l) { const p = procs.sys; if (!p) return; try { p.stdin.write(l + "\n"); } catch (_) {} }
          function rate(b) {
            b = Number(b) || 0;
            if (b >= 1048576) return (b / 1048576).toFixed(b >= 10485760 ? 0 : 1) + " MB/s";
            if (b >= 1024) return Math.round(b / 1024) + " KB/s";
            return Math.round(b) + " B/s";
          }
          const NICE = { obs64: "OBS Studio", obs32: "OBS Studio", chrome: "Chrome", msedge: "Edge", firefox: "Firefox", discord: "Discord", teams: "Teams", ms: "Teams", zoom: "Zoom", spotify: "Spotify", vlc: "VLC", winrar: "WinRAR", "7zg": "7-Zip", "7zfm": "7-Zip", explorer: "Penjelajah File", bandicam: "Bandicam", whatsapp: "WhatsApp", telegram: "Telegram", slack: "Slack" };
          function niceName(n) {
            const k = String(n || "").toLowerCase().replace(/\.exe$/, "");
            return NICE[k] || prettyApp(n);
          }

          /* ----- pengelolaan proses ----- */
          function startSys() {
            if (procs.sys || !S.enabled || quitting) return;
            if (!sysExists()) { sysState = { ok: false, err: "fxsys.exe tidak ditemukan" }; return; }
            procs.sys = runHelper([], onSys, () => {
              procs.sys = null; sysState = { ok: false, err: sysState.err || "pembantu berhenti" };
              clearSysLive();
              if (S.enabled && !quitting && sysTries++ < 5) setTimeout(startSys, 3000);
            }, sysExe());
          }
          function stopSys() {
            const p = procs.sys; procs.sys = null;
            if (p) { try { p.stdin.write("cursor off\n"); } catch (_) {} killHelper(p); }
            sysState = { ok: false, err: "" };
            stopDragWatch(); disarmHub(false); clearSysLive();
          }
          function clearSysLive() {
            Object.keys(L).forEach(k => { if (k !== "hub") delete L[k]; });
            netHi = netLo = resHi = resLo = 0; lag = false; mediaWas = false;
            pushLive();
          }
          function pushLive() {
            if (liveT) return;
            liveT = setTimeout(() => {
              liveT = null;
              if (!S.enabled || !isl || isl.isDestroyed()) return;
              toIsl("live", S.live ? Object.keys(L).map(k => L[k]) : []);
            }, 120);
          }
          function setLive(id, a) { if (a) L[id] = a; else if (L[id]) delete L[id]; pushLive(); }
          function syncSysFlags() {
            if (!procs.sys) return;
            sysCmd("btn " + (S.hub && S.live && S.edge === "top" ? 1 : 0));
            sysCmd("top " + ((S.rmon > 0 && S.live && lag) ? 1 : 0));
            sysCmd("ping " + ((gameState.full && S.game && S.live) ? 1 : 0));
          }
          function applyCursor() {
            if (!procs.sys || !sysState.ok) return;
            if (S.curs) sysCmd("cursor " + S.cstyle + " " + String(S.ccolor).replace("#", "") + " " + (S.csize | 0));
            else sysCmd("cursor off");
          }
          const BOOLOPT = ["appnotif", "live", "media", "devs", "net", "prog", "hub", "game", "curs"];
          function setOpt(key, val) {
            if (BOOLOPT.indexOf(key) >= 0) S[key] = !!val;
            else if (key === "rmon") S.rmon = Math.round(clamp(val, 0, 2));
            else if (key === "cstyle") S.cstyle = ["arrow", "ring", "dot", "cross"].indexOf(val) >= 0 ? val : "ring";
            else if (key === "ccolor") { if (/^#[0-9a-f]{6}$/i.test(String(val))) S.ccolor = String(val); }
            else if (key === "csize") S.csize = Math.round(clamp(val, 20, 64));
            else return;
            save();
            if (key === "appnotif") applyAnim();
            if (!S.live) Object.keys(L).forEach(k => delete L[k]);
            else {
              if (!S.media) delete L.media;
              if (!S.devs) { delete L.rec; delete L.mic; delete L.cam; }
              if (!S.net) delete L.net;
              if (!S.prog) delete L.prog;
              if (!S.game) delete L.game;
              if (!S.rmon && !lag) delete L.mon;
            }
            refreshHub();
            syncSysFlags(); applyCursor(); pushLive();
          }

          /* ----- pesan dari fxsys.exe ----- */
          function onSys(m) {
            if (!S.enabled) return;
            switch (m.t) {
              case "ready": sysState = { ok: true, err: "" }; sysTries = 0; syncSysFlags(); applyCursor(); break;
              case "err": sysState.err = String(m.m || ""); break;
              case "net": onNet(m); break;
              case "res": onRes(m); break;
              case "top": lastTop = (Array.isArray(m.l) ? m.l : []).filter(x => x && Number.isInteger(x.pid)).slice(0, 4); if (lag && L.mon) setLive("mon", monActivity()); break;
              case "dev": onDev(m); break;
              case "media": onMedia(m); break;
              case "lvl": if (L.media && mediaState.play) toIsl("lvl", m.p | 0); break;
              case "prog": onProg(m); break;
              case "fg": onFg(m); break;
              case "fps": gameState.fps = m.v | 0; refreshGame(); break;
              case "ping": onPing(m); break;
              case "btn": onBtn(m); break;
              case "clip": clipChanged(true); break;
            }
          }

          /* ----- kecepatan internet ----- */
          function onNet(m) {
            const d = m.d | 0, u = m.u | 0;
            netHist.push(d); if (netHist.length > 30) netHist.shift();
            if (!S.live || !S.net) { if (L.net) setLive("net", null); return; }
            if (d >= 1.5 * 1048576) { netHi++; netLo = 0; } else if (d < 0.4 * 1048576) { netLo++; netHi = 0; } else netLo = 0;
            if (!L.net && netHi >= 3) {
              // mulai mengunduh besar: tampilkan sebagai live activity
            }
            if ((L.net && netLo < 6) || (!L.net && netHi >= 3)) {
              setLive("net", { id: "net", p: 30, glyph: "\u2193", color: "#30d158", val: rate(d), vc: "#30d158", panel: { id: "net", type: "net", d: d, u: u, h: netHist.slice() } });
            } else if (L.net && netLo >= 6) setLive("net", null);
          }

          /* ----- CPU / RAM / GPU ----- */
          function monPanel() { return { id: "mon", type: "mon", cpu: lastRes.cpu, ram: lastRes.ram, gpu: lastRes.gpu, lag: lag, top: lastTop }; }
          function monActivity() {
            return { id: "mon", p: lag ? 90 : 10, glyph: lag ? "\u26A0" : "\u25A6", color: lag ? "#ff9f0a" : "#8e8e93", val: lastRes.cpu + "% \u00B7 " + lastRes.ram + "%", vc: lag ? "#ff9f0a" : "", panel: monPanel() };
          }
          function onRes(m) {
            lastRes = { cpu: m.cpu | 0, ram: m.ram | 0, gpu: m.gpu == null ? -1 : (m.gpu | 0) };
            if (!S.live || !S.rmon) { if (L.mon) setLive("mon", null); lag = false; return; }
            if (m.cpu >= 90 || m.ram >= 90) { resHi++; resLo = 0; } else if (m.cpu < 80 && m.ram < 85) { resLo++; resHi = 0; }
            if (!lag && resHi >= 4 && Date.now() - lagAt > 90000) {
              lag = true; lagAt = Date.now(); syncSysFlags();
              setLive("mon", monActivity());
              toIsl("panel", { spec: monPanel(), sticky: true });
              setTimeout(() => { if (lag && isl && !isl.isDestroyed()) toIsl("stop", 1); }, 20000);
            } else if (lag && resLo >= 6) { lag = false; lastTop = []; syncSysFlags(); }
            if (S.rmon === 2 || lag) setLive("mon", monActivity()); else if (L.mon) setLive("mon", null);
          }

          /* ----- mikrofon / kamera / perekaman ----- */
          const DEVDEF = [["rec", "#ff3b30", "Merekam layar / audio", "\u23FA"], ["mic", "#ff9f0a", "Mikrofon dipakai", "🎙"], ["cam", "#30d158", "Kamera dipakai", "📷"]];
          function onDev(m) {
            const prev = devPrev;
            const cur = { rec: (m.rec || []).slice(), mic: (m.mic || []).filter(x => (m.rec || []).indexOf(x) < 0), cam: (m.cam || []).slice() };
            devPrev = cur;
            if (!S.live || !S.devs) { ["rec", "mic", "cam"].forEach(k => setLive(k, null)); return; }
            const rows = [];
            DEVDEF.forEach(d => cur[d[0]].forEach(n => rows.push({ c: d[1], t: d[2], s: niceName(n) })));
            const panel = { id: "dev", type: "rows", title: "Sedang aktif", rows: rows };
            DEVDEF.forEach((d, i) => {
              const k = d[0], list = cur[k];
              if (!list.length) { setLive(k, null); return; }
              setLive(k, { id: k, p: 100 - i, dot: d[1], dotOnly: true, panel: panel });
              const fresh = list.filter(n => prev[k].indexOf(n) < 0);
              if (fresh.length) showIsland({ title: d[2], text: fresh.map(niceName).join(", "), app: "Privasi", icon: svgIcon(d[1], d[3]), appId: "", kind: "dev", quiet: true });
            });
          }

          /* ----- media / audio ----- */
          function mediaActivity() {
            return { id: "media", p: 50, glyph: "\u266A", color: "#ff375f", wave: true, on: mediaState.play, val: "", panel: { id: "media", type: "media", app: mediaState.app, title: mediaState.title, artist: mediaState.artist, play: mediaState.play } };
          }
          function onMedia(m) {
            const play = !!m.play;
            mediaState = { play: play, app: String(m.app || ""), title: String(m.title || ""), artist: String(m.artist || "") };
            if (!S.live || !S.media) { setLive("media", null); mediaWas = play; return; }
            if (play) {
              clearTimeout(mediaGone); mediaGone = null;
              setLive("media", mediaActivity());
              const key = mediaState.app + "|" + mediaState.title;
              if ((!mediaWas || key !== mediaToastKey) && Date.now() - mediaToastAt > 8000 && !quiet()) {
                mediaToastAt = Date.now(); mediaToastKey = key;
                showIsland({
                  title: mediaState.title || "Audio sedang diputar",
                  text: [mediaState.artist, mediaState.app].filter(Boolean).join(" \u00B7 ") || "Suara dari PC",
                  app: mediaState.app || "Audio", icon: svgIcon("#ff375f", "\u266A"), appId: "", kind: "media", quiet: true
                });
              }
            } else if (L.media) {
              setLive("media", mediaActivity());
              if (!mediaGone) mediaGone = setTimeout(() => { mediaGone = null; if (!mediaState.play) setLive("media", null); }, 10000);
            }
            mediaWas = play;
          }

          /* ----- progres render / ekstrak ----- */
          function onProg(m) {
            const pct = m.pct | 0;
            if (m.pct < 0) {
              if (progState.pct >= 0 && progState.max >= 70 && S.prog && S.live && !quiet()) {
                showIsland({ title: "Selesai", text: niceName(progState.app) + " \u00B7 proses rampung", app: "Progres", icon: svgIcon("#30d158", "\u2713"), appId: "", kind: "prog", quiet: true });
              }
              progState = { pct: -1, app: "", what: "", max: 0 };
              setLive("prog", null);
              return;
            }
            const app0 = String(m.app || "");
            progState = { pct: pct, app: app0, what: String(m.what || ""), max: app0 === progState.app ? Math.max(progState.max, pct) : pct };
            if (!S.live || !S.prog) return;
            setLive("prog", { id: "prog", p: 60, glyph: "", color: "#0a84ff", ring: pct, val: pct + "%", vc: "#0a84ff", panel: { id: "prog", type: "prog", title: niceName(app0), sub: progState.what, pct: pct } });
          }

          /* ----- mode game: FPS & ping ----- */
          function refreshGame() {
            if (!gameState.full || !S.game || !S.live) { if (L.game) setLive("game", null); return; }
            const g = gameState;
            setLive("game", {
              id: "game", p: 70, glyph: "🎮", val: (g.fps >= 0 ? g.fps + " FPS" : "-") + " \u00B7 " + (g.ping >= 0 ? g.ping + "ms" : "-"),
              vc: g.ping > 100 ? "#ff453a" : (g.ping > 60 ? "#ff9f0a" : "#30d158"),
              panel: { id: "game", type: "game", fps: g.fps, ping: g.ping, jit: g.jit, exe: niceName(g.exe) }
            });
          }
          function onFg(m) {
            gameState.full = !!m.full; gameState.exe = String(m.exe || "");
            gameState.fps = -1; gameState.ping = -1; gameState.jit = -1; pingHist.length = 0;
            syncSysFlags(); refreshGame();
          }
          function onPing(m) {
            if (m.ms >= 0) { pingHist.push(m.ms); if (pingHist.length > 10) pingHist.shift(); gameState.ping = m.ms | 0; }
            else gameState.ping = -1;
            if (pingHist.length > 1) { let s = 0; for (let i = 1; i < pingHist.length; i++) s += Math.abs(pingHist[i] - pingHist[i - 1]); gameState.jit = Math.round(s / (pingHist.length - 1)); }
            refreshGame();
          }

          /* ----- hub seret & lepas ----- */
          const hubDir = () => { const d = path.join(app.getPath("temp"), "island-hub"); try { fs.mkdirSync(d, { recursive: true }); } catch (_) {} return d; };
          const safeName = n => String(n || "berkas").replace(/[\\/:*?"<>|\u0000-\u001f]/g, "_").slice(0, 80) || "berkas";
          function hubSpec(drop) { return { id: "hub", type: "hub", drop: !!drop, items: hubItems.map(i => ({ id: i.id, name: i.name, glyph: i.glyph, thumb: i.thumb || "" })) }; }
          function refreshHub() {
            if (!S.live || !S.hub || !hubItems.length) { if (L.hub) setLive("hub", null); return; }
            setLive("hub", { id: "hub", p: 20, glyph: "📥", color: "#0a84ff", val: String(hubItems.length), panel: hubSpec(false) });
          }
          function addHubItem(it) {
            it.id = "h" + (hubSeq++);
            hubItems.unshift(it);
            if (hubItems.length > 12) hubItems.length = 12;
            if (!it.ic && it.path) app.getFileIcon(it.path, { size: "normal" }).then(i => { it.ic = i; }).catch(() => {});
          }
          const IMG_EXT = /\.(png|jpe?g|gif|webp|bmp)$/i;
          function fileItem(p, nameHint) {
            let st = null;
            try { st = fs.statSync(p); } catch (_) { return null; }
            const it = { kind: "file", path: p, name: nameHint || path.basename(p), glyph: st.isDirectory() ? "📁" : "📄", thumb: "", ic: null };
            if (!st.isDirectory() && IMG_EXT.test(p) && st.size < 20 * 1024 * 1024) {
              try {
                const ni = nativeImage.createFromPath(p);
                if (!ni.isEmpty()) { const s = ni.getSize(), k = 96 / Math.max(s.width, s.height); const t = k < 1 ? ni.resize({ width: Math.max(1, Math.round(s.width * k)), height: Math.max(1, Math.round(s.height * k)) }) : ni; it.thumb = t.toDataURL(); it.ic = t.resize({ width: 48 }); }
              } catch (_) {}
            }
            return it;
          }
          function hubDrop(d) {
            let added = 0;
            (Array.isArray(d.files) ? d.files : []).slice(0, 8).forEach(f => {
              const p = String((f && f.path) || "");
              if (!p || !path.isAbsolute(p)) return;
              const it = fileItem(p, String(f.name || ""));
              if (it) { addHubItem(it); added++; }
            });
            (Array.isArray(d.blobs) ? d.blobs : []).slice(0, 4).forEach(b => {
              try {
                const buf = Buffer.from(b.data);
                if (!buf.length || buf.length > 25 * 1024 * 1024) return;
                const p = path.join(hubDir(), Date.now() + "-" + safeName(b.name));
                fs.writeFileSync(p, buf);
                const it = fileItem(p, safeName(b.name));
                if (it) { addHubItem(it); added++; }
              } catch (_) {}
            });
            if (!added) {
              const url = String(d.url || "").split(/\r?\n/)[0].trim(), text = String(d.text || "");
              const body = /^https?:\/\//i.test(url) ? url : text;
              if (body) {
                try {
                  const p = path.join(hubDir(), (/^https?:/i.test(body) ? "tautan-" : "teks-") + Date.now() + (/^https?:/i.test(body) ? ".url" : ".txt"));
                  fs.writeFileSync(p, /^https?:/i.test(body) ? "[InternetShortcut]\r\nURL=" + body + "\r\n" : body, "utf8");
                  addHubItem({ kind: "text", path: p, name: body.replace(/\s+/g, " ").slice(0, 24), glyph: /^https?:/i.test(body) ? "🔗" : "📝", thumb: "", ic: null });
                  added++;
                } catch (_) {}
              }
            }
            hubDropPanel = false; hubDropAt = Date.now();
            disarmHub(false);
            refreshHub();
            if (added) toIsl("panel", { spec: hubSpec(false), sticky: false });
          }
          function hubDragOut(id) {
            const it = hubItems.find(x => x.id === id);
            if (!it || !it.path || !fs.existsSync(it.path)) return;
            let icon = it.ic;
            if ((!icon || icon.isEmpty()) && ownIcon) { try { icon = nativeImage.createFromDataURL(ownIcon).resize({ width: 32 }); } catch (_) {} }
            if (!icon || icon.isEmpty()) return;
            try { isl.webContents.startDrag({ file: it.path, icon: icon }); } catch (_) {}
          }
          function hubEnter() {
            if (!S.hub || !S.live || !hubArmed) return;
            hubDropPanel = true;
            toIsl("panel", { spec: hubSpec(true), sticky: true });
          }
          function inHubZone(c, pad) {
            if (!isl || isl.isDestroyed() || S.edge !== "top") return false;
            const b = isl.getBounds(), cx = b.x + b.width / 2;
            return Math.abs(c.x - cx) < 190 + pad && c.y >= b.y - 4 && c.y < b.y + 140 + pad;
          }
          function armHub() {
            if (hubArmed || !isl || isl.isDestroyed()) return;
            hubArmed = true;
            try { isl.setIgnoreMouseEvents(false); } catch (_) {}
            toIsl("dz", 1);
          }
          function disarmHub(collapse) {
            if (!hubArmed) return;
            hubArmed = false;
            if (isl && !isl.isDestroyed()) { try { isl.setIgnoreMouseEvents(true, { forward: true }); } catch (_) {} toIsl("dz", 0); }
            if (collapse && hubDropPanel) { hubDropPanel = false; toIsl("stop", 1); }
          }
          function stopDragWatch() { if (dragTimer) { clearInterval(dragTimer); dragTimer = null; } }
          // Hanya tangan yang menarik (tombol kiri ditahan) dari LUAR zona yang dianggap seret-lepas; klik biasa di zona tidak terganggu.
          function onBtn(m) {
            if (!S.hub || !S.live || !isl || isl.isDestroyed() || S.edge !== "top") return;
            if (m.l) {
              pressInZone = inHubZone(screen.getCursorScreenPoint(), 40);
              if (pressInZone) return;
              stopDragWatch();
              dragTimer = setInterval(() => {
                const c = screen.getCursorScreenPoint();
                if (inHubZone(c, 0)) armHub(); else if (hubArmed && !inHubZone(c, 70)) disarmHub(true);
              }, 50);
            } else {
              stopDragWatch();
              setTimeout(() => { if (Date.now() - hubDropAt > 800) disarmHub(true); }, 350);
            }
          }

          /* ----- tombol di island ----- */
          function onAct(a, arg) {
            if (a === "media") {
              if (["prev", "playpause", "next"].indexOf(arg) >= 0) sysCmd("media " + arg);
            } else if (a === "kill") {
              const pid = Number(arg);
              if (!Number.isInteger(pid) || !lastTop.some(x => x.pid === pid)) return;   // hanya proses yang sedang ditampilkan
              execFile("taskkill", ["/PID", String(pid), "/F"], { windowsHide: true }, () => {
                lastTop = lastTop.filter(x => x.pid !== pid);
                if (L.mon) setLive("mon", monActivity());
              });
            } else if (a === "hubdel") {
              hubItems = hubItems.filter(x => x.id !== String(arg));
              refreshHub();
              if (L.hub) toIsl("panel", { spec: hubSpec(false), sticky: false });
