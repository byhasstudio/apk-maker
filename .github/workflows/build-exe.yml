              static string JoinJ(List<string> l)
              {
                  StringBuilder sb = new StringBuilder("[");
                  for (int i = 0; i < l.Count && i < 6; i++)
                  {
                      if (i > 0) sb.Append(',');
                      sb.Append(Program.J(l[i]));
                  }
                  return sb.Append(']').ToString();
              }

