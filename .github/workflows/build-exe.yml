                  [PreserveSig] int GetMute([MarshalAs(UnmanagedType.Bool)] out bool m);
              }
              
              static IAudioEndpointVolume VolEv = null;
              static readonly object VolLock = new object();
              
              static IAudioEndpointVolume OpenVol()
              {
                  IMMDeviceEnumerator en = (IMMDeviceEnumerator)new MMDeviceEnumeratorCom();
                  IMMDevice dev;
                  if (en.GetDefaultAudioEndpoint(0, 1, out dev) != 0 || dev == null) return null;
                  Guid iid = new Guid("5CDF2C82-841E-4546-9722-0CF74078229A");
                  object o;
                  if (dev.Activate(ref iid, 23, IntPtr.Zero, out o) != 0) return null;
                  return o as IAudioEndpointVolume;
              }
              
              public static void SetVol(int v)
              {
                  try
                  {
                      lock (VolLock)
                      {
                          if (VolEv == null) VolEv = OpenVol();
                          if (VolEv == null) return;
                          Guid g = Guid.Empty;
                          VolEv.SetMasterVolumeLevelScalar(Math.Max(0, Math.Min(100, v)) / 100f, ref g);
                          if (v > 0) VolEv.SetMute(false, ref g);
                      }
                  }
                  catch (Exception) { VolEv = null; }
              }
              
              public static void ToggleMute()
              {
                  try
                  {
                      lock (VolLock)
                      {
                          if (VolEv == null) VolEv = OpenVol();
                          if (VolEv == null) return;
                          bool m;
                          if (VolEv.GetMute(out m) != 0) return;
                          Guid g = Guid.Empty;
                          VolEv.SetMute(!m, ref g);
                      }
                  }
                  catch (Exception) { VolEv = null; }
              }
              
              public static void Volume()
              {
                  string last = "";
                  while (true)
                  {
                      try
                      {
                          lock (VolLock)
                          {
                              if (VolEv == null) VolEv = OpenVol();
                              if (VolEv != null)
                              {
                                  float v = 0; bool m = false;
                                  int r1 = VolEv.GetMasterVolumeLevelScalar(out v);
                                  int r2 = VolEv.GetMute(out m);
                                  if (r1 != 0 || r2 != 0) VolEv = null;
                                  else
                                  {
                                      string js = "{\"t\":\"vol\",\"v\":" + (int)Math.Round(v * 100) + ",\"m\":" + (m ? 1 : 0) + "}";
                                      if (js != last) { last = js; Program.Emit(js); }
                                  }
                              }
                          }
                      }
                      catch (Exception) { VolEv = null; }
                      Thread.Sleep(450);
                  }
              }

              static IAudioMeterInformation OpenMeter()
              {
                  IMMDeviceEnumerator en = (IMMDeviceEnumerator)new MMDeviceEnumeratorCom();
