              [ComImport, Guid("BCDE0395-E52F-467C-8E3D-C4579291692E")] class MMDeviceEnumeratorCom { }

              [ComImport, Guid("A95664D2-9614-4F35-A746-DE8DB63617E6"), InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
              interface IMMDeviceEnumerator
              {
                  [PreserveSig] int EnumAudioEndpoints(int dataFlow, int stateMask, out IntPtr devices);
                  [PreserveSig] int GetDefaultAudioEndpoint(int dataFlow, int role, out IMMDevice endpoint);
              }

              [ComImport, Guid("D666063F-1587-4E43-81F1-B948E807363F"), InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
              interface IMMDevice
              {
                  [PreserveSig] int Activate(ref Guid iid, int clsCtx, IntPtr activationParams, [MarshalAs(UnmanagedType.IUnknown)] out object iface);
              }

              [ComImport, Guid("C02216F6-8C67-4B5B-9D00-D008E73E0064"), InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
              interface IAudioMeterInformation
              {
                  [PreserveSig] int GetPeakValue(out float peak);
              }

              static IAudioMeterInformation OpenMeter()
              {
                  IMMDeviceEnumerator en = (IMMDeviceEnumerator)new MMDeviceEnumeratorCom();
                  IMMDevice dev;
                  if (en.GetDefaultAudioEndpoint(0, 1, out dev) != 0 || dev == null) return null;
                  Guid iid = new Guid("C02216F6-8C67-4B5B-9D00-D008E73E0064");
                  object o;
                  if (dev.Activate(ref iid, 23, IntPtr.Zero, out o) != 0) return null;
                  return o as IAudioMeterInformation;
              }

              static readonly string[] BROWSERS = new string[] { "chrome", "msedge", "firefox", "brave", "opera", "vivaldi" };
              static readonly string[] BSUF = new string[] { " - Google Chrome", " - Microsoft\u200B Edge", " - Microsoft Edge", " \u2014 Mozilla Firefox", " - Mozilla Firefox", " - Brave", " - Opera", " - Vivaldi" };
              static readonly string[] SITES = new string[] { " - YouTube Music", " - YouTube", " | SoundCloud", " - SoundCloud", " \u2022 Spotify", " | Spotify" };

              static string Trim(string t, string[] sufs)
              {
                  foreach (string s in sufs)
                  {
                      if (t.EndsWith(s, StringComparison.OrdinalIgnoreCase)) return t.Substring(0, t.Length - s.Length);
                  }
                  return null;
              }

              // hasil: { app, judul, artis } atau null
              static string[] FindMedia()
              {
                  List<Wnd.Item> ws = Wnd.Visible();
                  string[] spot = null, web = null, vlc = null;
                  foreach (Wnd.Item w in ws)
                  {
                      string t = w.Title;
                      if (w.Exe == "spotify")
                      {
                          if (t == "Spotify" || t.StartsWith("Spotify Free") || t.StartsWith("Spotify Premium") || t.Length == 0) { if (spot == null) spot = new string[] { "Spotify", "", "" }; continue; }
                          int i = t.IndexOf(" - ", StringComparison.Ordinal);
                          spot = i > 0 ? new string[] { "Spotify", t.Substring(i + 3), t.Substring(0, i) } : new string[] { "Spotify", t, "" };
                      }
                      else if (Array.IndexOf(BROWSERS, w.Exe) >= 0 && web == null)
                      {
                          string core = Trim(t, BSUF);
                          if (core == null) continue;
                          string site = Trim(core, SITES);
                          if (site == null) continue;
                          string app = core.EndsWith("YouTube Music") ? "YouTube Music" : (core.EndsWith("SoundCloud") ? "SoundCloud" : (core.EndsWith("Spotify") ? "Spotify" : "YouTube"));
                          web = new string[] { app, site, "" };
                      }
                      else if (w.Exe == "vlc" && vlc == null)
                      {
                          string core = Trim(t, new string[] { " - VLC media player" });
                          if (core != null) vlc = new string[] { "VLC", core, "" };
                      }
                  }
                  if (spot != null && spot[1].Length > 0) return spot;
                  if (web != null) return web;
                  if (vlc != null) return vlc;
                  return spot;
              }

              public static void Audio()
              {
                  IAudioMeterInformation meter = null;
                  DateTime meterAt = DateTime.MinValue;
                  DateTime loudSince = DateTime.MinValue, lastLoud = DateTime.MinValue;
                  bool play = false;
                  string lastMedia = "";
                  int tick = 0;
                  while (true)
                  {
                      Thread.Sleep(120);
                      tick++;
                      float peak = 0;
                      try
                      {
                          if (meter == null && (DateTime.UtcNow - meterAt).TotalSeconds > 3) { meterAt = DateTime.UtcNow; meter = OpenMeter(); }
                          if (meter != null)
                          {
                              if (meter.GetPeakValue(out peak) != 0) { meter = null; peak = 0; }
                          }
                      }
                      catch (Exception) { meter = null; peak = 0; }
                      DateTime now = DateTime.UtcNow;
                      if (peak > 0.004f)
                      {
                          lastLoud = now;
                          if (loudSince == DateTime.MinValue) loudSince = now;
                      }
                      else if ((now - lastLoud).TotalMilliseconds > 1500) loudSince = DateTime.MinValue;
                      bool p = loudSince != DateTime.MinValue && (now - loudSince).TotalMilliseconds >= 900 && (now - lastLoud).TotalMilliseconds < 1500;
                      if (p) Program.Emit("{\"t\":\"lvl\",\"p\":" + (int)(Math.Min(1f, peak) * 1000) + "}");
                      if (tick % 8 == 0 || p != play)
                      {
                          string[] md = null;
                          try { md = FindMedia(); } catch (Exception) { }
                          string js = "{\"t\":\"media\",\"play\":" + (p ? 1 : 0)
                              + ",\"app\":" + Program.J(md == null ? "" : md[0])
                              + ",\"title\":" + Program.J(md == null ? "" : md[1])
                              + ",\"artist\":" + Program.J(md == null ? "" : md[2]) + "}";
                          if (js != lastMedia) { lastMedia = js; Program.Emit(js); }
                      }
                      play = p;
                  }
              }

              // ----- progres render / ekstrak / salin yang tampil di judul jendela
              static readonly Regex PCT = new Regex("(?<![\\d.])(\\d{1,3})\\s?%", RegexOptions.Compiled);
              static readonly string[] KEYW = new string[] { "complete", "selesai", "rendering", "render", "encoding", "extracting", "exporting", "export", "copying", "moving", "compress", "convert", "mengekstrak", "menyalin", "memindahkan", "ekspor", "queue", "winrar", "7-zip", "bandizip", "peazip", "encoder" };
              static readonly string[] SKIPEXE = new string[] { "chrome", "msedge", "firefox", "brave", "opera", "vivaldi", "spotify", "discord", "code", "devenv" };

              public static void Progress()
              {
                  int miss = 0, lastPct = -2;
                  string lastApp = "";
                  while (true)
                  {
                      Thread.Sleep(1000);
                      try
                      {
                          string app = "", what = "";
                          int pct = -1;
                          foreach (Wnd.Item w in Wnd.Visible())
                          {
                              if (Array.IndexOf(SKIPEXE, w.Exe) >= 0) continue;
                              Match m = PCT.Match(w.Title);
                              if (!m.Success) continue;
                              int v = int.Parse(m.Groups[1].Value, CultureInfo.InvariantCulture);
                              if (v > 100) continue;
                              string tl = w.Title.ToLowerInvariant();
                              bool ok = m.Index == 0 || w.Cls == "OperationStatusWindow";
                              if (!ok) foreach (string k in KEYW) if (tl.IndexOf(k, StringComparison.Ordinal) >= 0) { ok = true; break; }
                              if (!ok) continue;
                              pct = v;
                              app = w.Exe;
                              what = w.Title.Length > 60 ? w.Title.Substring(0, 60) : w.Title;
                              break;
                          }
                          if (pct >= 0)
                          {
                              miss = 0;
                              if (pct != lastPct || app != lastApp)
                              {
                                  lastPct = pct; lastApp = app;
                                  Program.Emit("{\"t\":\"prog\",\"pct\":" + pct + ",\"app\":" + Program.J(app) + ",\"what\":" + Program.J(what) + "}");
                              }
                          }
                          else if (lastPct >= 0)
                          {
                              miss++;
                              if (miss >= 3) { lastPct = -1; lastApp = ""; Program.Emit("{\"t\":\"prog\",\"pct\":-1}"); }
                          }
                      }
                      catch (Exception) { }
                  }
              }

              // ----- mode game: layar penuh / tanpa bingkai + perkiraan FPS dari penyusun jendela (DWM)
              [DllImport("dwmapi.dll")] static extern int DwmGetCompositionTimingInfo(IntPtr hwnd, IntPtr info);

              static ulong ReadFrame(IntPtr buf, ref int good)
              {
                  // cbSize berbeda antar versi Windows: coba beberapa ukuran sampai sistem menerimanya
                  int[] sizes = good > 0 ? new int[] { good } : new int[] { 200, 232, 256, 264, 272, 280, 288, 296, 304, 312, 320, 168, 176, 184, 192, 208, 216, 224, 240, 248 };
                  foreach (int sz in sizes)
                  {
                      Marshal.WriteInt32(buf, 0, sz);
                      for (int i = 4; i < sz; i += 4) Marshal.WriteInt32(buf, i, 0);
                      Marshal.WriteInt32(buf, 0, sz);
                      if (DwmGetCompositionTimingInfo(IntPtr.Zero, buf) == 0)
                      {
                          good = sz;
                          return (ulong)Marshal.ReadInt64(buf, 64);
                      }
                  }
                  return 0;
              }

              public static void Game()
              {
                  IntPtr buf = Marshal.AllocHGlobal(512);
                  int good = 0;
                  bool full = false;
                  string exe = "";
                  ulong lastF = 0;
                  DateTime lastT = DateTime.UtcNow;
                  while (true)
                  {
                      Thread.Sleep(1000);
                      bool nf = false;
                      string ne = "";
                      try
                      {
                          IntPtr fg = Wnd.GetForegroundWindow();
                          if (fg != IntPtr.Zero && Wnd.IsWindowVisible(fg) && !Wnd.IsIconic(fg))
                          {
                              string cls = Wnd.Cls(fg);
                              ne = Wnd.ExeName(Wnd.PidOf(fg));
                              bool shell = cls == "Progman" || cls == "WorkerW" || cls == "Shell_TrayWnd" || ne == "explorer" || ne == "searchhost" || ne == "startmenuexperiencehost" || ne == "shellexperiencehost";
                              nf = !shell && Wnd.CoversMonitor(fg);
                          }
                      }
                      catch (Exception) { }
                      if (nf != full || (nf && ne != exe))
                      {
                          full = nf; exe = nf ? ne : "";
                          Program.Emit("{\"t\":\"fg\",\"full\":" + (full ? 1 : 0) + ",\"exe\":" + Program.J(exe) + "}");
                          lastF = 0;
                      }
                      if (full)
                      {
                          try
                          {
                              ulong f = ReadFrame(buf, ref good);
                              DateTime now = DateTime.UtcNow;
                              double dt = (now - lastT).TotalSeconds;
                              lastT = now;
                              int fps = -1;
                              if (f != 0 && lastF != 0 && f >= lastF && dt > 0.2) fps = (int)Math.Round((f - lastF) / dt);
                              if (f != 0) lastF = f;
                              if (fps >= 0 && fps < 1000) Program.Emit("{\"t\":\"fps\",\"v\":" + fps + "}");
                          }
                          catch (Exception) { }
                      }
                  }
              }

              // ----- ping
              public static void PingLoop()
              {
                  System.Net.NetworkInformation.Ping p = new System.Net.NetworkInformation.Ping();
                  string[] hosts = new string[] { "1.1.1.1", "8.8.8.8" };
                  int hi = 0;
                  while (true)
                  {
                      Thread.Sleep(1500);
                      if (!Program.PingOn) continue;
                      try
                      {
                          PingReply r = p.Send(hosts[hi], 1200);
                          if (r != null && r.Status == IPStatus.Success) Program.Emit("{\"t\":\"ping\",\"ms\":" + r.RoundtripTime + ",\"loss\":0}");
                          else { Program.Emit("{\"t\":\"ping\",\"ms\":-1,\"loss\":1}"); hi = (hi + 1) % hosts.Length; }
                      }
                      catch (Exception) { hi = (hi + 1) % hosts.Length; }
                  }
              }

