          let lastEnter = 0;
          window.addEventListener("dragenter", e => {
            e.preventDefault();
            const n = Date.now();
            if (n - lastEnter > 500) { lastEnter = n; ipcRenderer.send("fx:hubenter"); }
          }, true);
          window.addEventListener("dragover", e => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = "copy"; }, true);
          window.addEventListener("drop", e => {
            e.preventDefault();
            const dt = e.dataTransfer;
            if (!dt) return;
            // baca semuanya SEKARANG (data transfer hanya valid selama event)
