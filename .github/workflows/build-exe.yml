          }

          /* ----- progres render / ekstrak ----- */
          function onProg(m) {
            const pct = m.pct | 0;
            if (m.pct < 0) {
              if (progState.pct >= 0 && progState.max >= 70 && S.prog && S.live && !quiet()) {
                showIsland({ title: T("Selesai"), text: T("{n} · proses rampung", { n: niceName(progState.app) }), app: T("Progres"), icon: svgIcon("#30d158", "\u2713"), appId: "", kind: "prog", quiet: true });
              }
              progState = { pct: -1, app: "", what: "", max: 0 };
              setLive("prog", null);
              return;
            }
            const app0 = String(m.app || "");
            progState = { pct: pct, app: app0, what: String(m.what || ""), max: app0 === progState.app ? Math.max(progState.max, pct) : pct };
            if (!S.live || !S.prog) return;
            setLive("prog", { id: "prog", p: 60, glyph: "", color: "#0a84ff", ring: pct, val: pct + "%", vc: "#0a84ff", panel: { id: "prog", type: "prog", title: niceName(app0), sub: progState.what, pct: pct } });
          }

          /* ----- mode game: FPS & ping ----- */
          function refreshGame() {
            if (gameState.exe && gameHidden === gameState.exe) { if (L.game) setLive("game", null); return; }
            if (!gameState.full || !S.game || !S.live) { if (L.game) setLive("game", null); return; }
            const g = gameState;
            setLive("game", {
              id: "game", p: 70, glyph: "🎮", val: (g.fps >= 0 ? (g.real ? "" : "~") + g.fps + " FPS" : "-") + " \u00B7 " + (g.ping >= 0 ? g.ping + "ms" : "-"),
              vc: g.ping > 100 ? "#ff453a" : (g.ping > 60 ? "#ff9f0a" : "#30d158"),
              panel: { id: "game", type: "game", fps: g.fps, real: g.real, low: g.low, ping: g.ping, cpu: lastRes.cpu, ram: lastRes.ram, gpu: lastRes.gpu, h: (pm.frames || []).slice(-60), xh: !!(S.xh && xhOn), gm: S.gmode !== false, jit: g.jit, exe: niceName(g.exe) }
            });
          }
          function onFg(m) {
            gameState.full = !!m.full; gameState.exe = String(m.exe || ""); gameState.cur = String(m.cur || "");
            if (gameHidden && gameHidden !== gameState.exe) gameHidden = "";
            gameState.fps = -1; gameState.low = -1; gameState.real = false; gameState.ping = -1; gameState.jit = -1; pingHist.length = 0;
            pmStop(); syncSysFlags(); refreshGame(); xhUpdate(); pmSync(); gmApply();
          }
          /* ---------- Game mode: otomatis aktif di game yang terdeteksi (layar penuh / ditandai Ctrl+Alt+G) ---------- */
          let gmPrio = [];
          function gmSetPrio(level) {
            try {
              const os = require("os"), pr = os.constants.priority;
              const pids = [process.pid];
              try { app.getAppMetrics().forEach(x => { if (x.pid && pids.indexOf(x.pid) < 0) pids.push(x.pid); }); } catch (_) {}
              pids.forEach(id => { try { os.setPriority(id, level === "low" ? pr.PRIORITY_BELOW_NORMAL : pr.PRIORITY_NORMAL); } catch (_) {} });
            } catch (_) {}
          }
          function gmGamePrio(exe, high) {
            if (!/^[\w .()-]{1,80}$/.test(String(exe || ""))) return;
            const ps = "Get-Process -Name '" + String(exe).replace(/'/g, "") + "' -ErrorAction SilentlyContinue | ForEach-Object { try { $_.PriorityClass = '" + (high ? "AboveNormal" : "Normal") + "' } catch {} }";
            try { execFile("powershell.exe", ["-NoProfile", "-NonInteractive", "-WindowStyle", "Hidden", "-Command", ps], { windowsHide: true, timeout: 8000 }, () => {}); } catch (_) {}
          }
          let gmExe = "";
          function gmApply() {
            const want = !!S.gmode && !!gameState.full;
            if (want === gmOn) { if (want && gameState.exe && gameState.exe !== gmExe) { gmGamePrio(gmExe, false); gmExe = gameState.exe; gmGamePrio(gmExe, true); } return; }
            gmOn = want;
            if (want) {
              gmExe = gameState.exe || "";
              gmSetPrio("low");                                                // aplikasi ini jadi prioritas rendah supaya game dapat CPU penuh
              if (gmExe) gmGamePrio(gmExe, true);
              try { [spotWin, lpWin, mcWin, ccWin, ncWin].forEach(w => { if (w && !w.isDestroyed() && w.isVisible()) w.hide(); }); } catch (_) {}
              try { stopDockProc(); } catch (_) {}                             // berhenti memindai jendela selama bermain
              try { pmStop(); } catch (_) {}                                   // tanpa ETW/PresentMon: lebih ringan dan aman dari anti-cheat
            } else {
              gmSetPrio("normal");
              if (gmExe) gmGamePrio(gmExe, false);
              gmExe = "";
              try { if (S.dock) startDockProc(); } catch (_) {}
              try { pmSync(); } catch (_) {}
              try { mbPollWifi(); } catch (_) {}
            }
          }
          function onPing(m) {
            if (m.ms >= 0) { pingHist.push(m.ms); if (pingHist.length > 10) pingHist.shift(); gameState.ping = m.ms | 0; }
            else gameState.ping = -1;
            if (pingHist.length > 1) { let s = 0; for (let i = 1; i < pingHist.length; i++) s += Math.abs(pingHist[i] - pingHist[i - 1]); gameState.jit = Math.round(s / (pingHist.length - 1)); }
            refreshGame();
          }

          /* ---------- FPS akurat lewat PresentMon (Intel, MIT): membaca event Present asli dari Windows (ETW) ---------- */
          const pmExe = () => app.isPackaged ? path.join(process.resourcesPath, "PresentMon.exe") : path.join(__dirname, "bin", "PresentMon.exe");
          function pmExists() { try { return fs.statSync(pmExe()).size > 100000; } catch (_) { return false; } }
          const pm = { p: null, exe: "", ok: false, err: "", got: 0, hdr: null, buf: "", frames: [], tries: 0, triedFor: "", warned: false, timer: null, last: 0 };
          function pmWanted() { return !!(!gmOn && S.enabled && S.live && S.game && S.fpsreal && gameState.full && gameState.exe); }
          function pmStop() {
            if (pm.timer) { clearInterval(pm.timer); pm.timer = null; }
            const p = pm.p; pm.p = null; pm.ok = false; pm.got = 0; pm.hdr = null; pm.buf = ""; pm.frames = []; pm.exe = "";
            if (p) { try { p.kill(); } catch (_) {} }
            if (gameState.real) { gameState.real = false; gameState.fps = -1; gameState.low = -1; refreshGame(); }
          }
          function pmSync() {
            if (!pmWanted()) { if (pm.p || pm.timer) pmStop(); return; }
            const name = gameState.exe + ".exe";
            if (pm.p && pm.exe === name) return;
            pmStop();
            if (!pmExists()) { pm.err = "PresentMon tidak ada"; return; }
            if (!/^[\w .()-]{1,60}$/.test(name)) return;
            if (pm.triedFor !== name) { pm.triedFor = name; pm.tries = 0; }
            if (pm.tries >= 3) return;
            let p = null;
            try {
              p = spawn(pmExe(), ["-process_name", name, "-output_stdout", "-stop_existing_session", "-dont_restart_as_admin", "-no_top", "-terminate_on_proc_exit"], { windowsHide: true, stdio: ["ignore", "pipe", "pipe"] });
            } catch (e) { pm.err = String((e && e.message) || e); return; }
            pm.p = p; pm.exe = name; pm.err = ""; pm.got = 0; pm.hdr = null; pm.buf = ""; pm.frames = [];
            p.stdout.on("data", d => pmData(String(d)));
            p.stderr.on("data", d => { pm.err = (pm.err + String(d)).slice(-300); });
            p.on("error", e => { if (pm.p === p) pm.err = String((e && e.message) || e); });
            p.on("exit", () => {
              if (pm.p !== p) return;
              const denied = !pm.got && /access|administrator|privilege|Performance Log|elevat|denied/i.test(pm.err);
              pm.p = null; pm.ok = false;
              if (pm.timer) { clearInterval(pm.timer); pm.timer = null; }
              if (gameState.real) { gameState.real = false; gameState.fps = -1; gameState.low = -1; refreshGame(); }
              if (!pm.got) {
                pm.tries++;
                if (denied && !pm.warned && S.enabled && !quiet()) {
                  pm.warned = true;
                  showIsland({ title: T("FPS akurat butuh izin"), text: T('Buka pengaturan lalu tekan "Beri izin FPS" (sekali saja)'), app: "FPS", icon: svgIcon("#ff9f0a", "\u26A0"), appId: "", quiet: true });
                }
                if (!denied) setTimeout(pmSync, 4000);
              } else setTimeout(pmSync, 2000);
            });
            pm.timer = setInterval(pmTick, 500);
          }
          function pmData(chunk) {
            pm.buf += chunk;
            if (pm.buf.length > 200000) pm.buf = pm.buf.slice(-20000);
            let i;
            while ((i = pm.buf.indexOf("\n")) >= 0) {
              const line = pm.buf.slice(0, i).replace(/\r$/, ""); pm.buf = pm.buf.slice(i + 1);
              if (!line) continue;
              const c = line.split(",");
              if (!pm.hdr) {
                if (/Application/i.test(line) && /msBetweenPresents|FrameTime/i.test(line)) {
                  let ft = c.indexOf("msBetweenPresents"); if (ft < 0) ft = c.indexOf("FrameTime");
                  pm.hdr = { ft: ft };
                }
                continue;
              }
              const ms = parseFloat(c[pm.hdr.ft]);
              if (isFinite(ms) && ms > 0 && ms < 5000) { pm.frames.push(ms); pm.got++; pm.last = Date.now(); if (pm.frames.length > 900) pm.frames.splice(0, pm.frames.length - 900); }
            }
          }
          function pmTick() {
            if (!pm.p) return;
            const f = pm.frames;
            if (!f.length) return;
            if (Date.now() - pm.last > 2500) { gameState.fps = 0; gameState.low = 0; gameState.real = true; refreshGame(); return; }
            let acc = 0, n = 0;
            for (let k = f.length - 1; k >= 0 && acc < 1000; k--) { acc += f[k]; n++; }
            const fps = acc > 0 ? Math.round(n * 1000 / acc) : -1;
            const w = f.slice(-300).sort((a, b) => b - a), cnt = Math.max(3, Math.ceil(w.length * 0.01));
            let sum = 0; for (let k = 0; k < cnt && k < w.length; k++) sum += w[k];
            const low = sum > 0 ? Math.round(1000 / (sum / Math.min(cnt, w.length))) : -1;
            pm.ok = true; gameState.fps = fps; gameState.low = low; gameState.real = true;
            refreshGame();
          }
          // sekali saja: masukkan akun ini ke grup "Performance Log Users" (dikenali lewat SID, jadi tidak tergantung bahasa Windows)
          // supaya PresentMon boleh membaca event tanpa admin. Berlaku setelah sign out.
          let pmGrpV = -1, pmGrpAt = 0;
          function pmGrpCheck(cb) {
            pmGrpAt = Date.now();
            try { execFile("whoami", ["/groups"], { windowsHide: true }, (e, out) => { if (!e) pmGrpV = /S-1-5-32-559/i.test(String(out)) ? 1 : 0; if (cb) cb(); }); } catch (_) { if (cb) cb(); }
          }
          function pmGrp() { if (Date.now() - pmGrpAt > 20000) pmGrpCheck(); return pmGrpV; }
          const GRP_NAME_PS = "$g=(New-Object System.Security.Principal.SecurityIdentifier 'S-1-5-32-559').Translate([System.Security.Principal.NTAccount]).Value.Split('\\')[-1]";
          function grantFps() {
            let u = "";
            try { u = require("os").userInfo().username; } catch (_) {}
            if (!/^[\w .-]{1,40}$/.test(u)) return;
            const dom = String(process.env.USERDOMAIN || "");
            const member = /^[\w .-]{1,40}$/.test(dom) ? dom + "\\" + u : u;
            const ps = "$ErrorActionPreference='Stop'; " + GRP_NAME_PS + "; net localgroup $g '" + member + "' /add";
            const b64 = Buffer.from(ps, "utf16le").toString("base64");
            const cmd = "Start-Process powershell -Verb RunAs -Wait -WindowStyle Hidden -ArgumentList '-NoProfile','-EncodedCommand','" + b64 + "'";
            pm.tries = 0; pm.warned = false;
            showIsland({ title: T("Izin diminta"), text: T("Setujui jendela admin (Yes). Hasilnya aku cek otomatis."), app: "FPS", icon: svgIcon("#0a84ff", "\u2713"), appId: "", quiet: true });
            try {
              execFile("powershell.exe", ["-NoProfile", "-NonInteractive", "-Command", cmd], { windowsHide: true }, () => {
                // cek apakah akun sudah ada di grup, lalu apakah sesi Windows ini sudah memuatnya (butuh sign out)
                execFile("powershell.exe", ["-NoProfile", "-NonInteractive", "-Command", GRP_NAME_PS + "; net localgroup $g"], { windowsHide: true }, (e, out) => {
                  const inGroup = !e && String(out).toLowerCase().indexOf(u.toLowerCase()) >= 0;
                  pmGrpCheck(() => {
                    let t, x, col, gl;
                    if (!inGroup) { t = T("Izin belum masuk"); x = T("Jendela admin tadi ditolak atau ditutup. Tekan Beri izin FPS lagi lalu pilih Yes."); col = "#ff453a"; gl = "\u2715"; }
                    else if (pmGrpV === 1) { t = T("Izin FPS aktif"); x = T("Sudah berlaku di sesi ini. Buka game, lalu tandai sebagai game di pengaturan bila belum muncul."); col = "#30d158"; gl = "\u2713"; }
                    else { t = T("Izin terpasang"); x = T("Tinggal keluar-masuk (sign out) Windows sekali supaya berlaku."); col = "#ff9f0a"; gl = "\u26A0"; }
                    showIsland({ title: t, text: x, app: "FPS", icon: svgIcon(col, gl), appId: "", quiet: true });
                    pmSync();
                  });
                });
              });
            } catch (_) {}
          }

          /* ----- pilih game manual dari pengaturan: mode "game" | "notgame" | "auto" (hapus tanda) ----- */
          function setGameMark(name, mode) {
            const n = String(name || "").trim().toLowerCase().replace(/\.exe$/, "");
            if (!/^[\w.() -]{1,60}$/.test(n)) return;
            const gl = (S.gamelist || []).filter(x => x !== n), ng = (S.nogame || []).filter(x => x !== n);
            if (mode === "game") gl.push(n); else if (mode === "notgame") ng.push(n);
            S.gamelist = gl.slice(-60); S.nogame = ng.slice(-60);
            save(); syncSysFlags();
          }

          /* ----- hub seret & lepas ----- */
          const hubDir = () => { const d = path.join(app.getPath("temp"), "island-hub"); try { fs.mkdirSync(d, { recursive: true }); } catch (_) {} return d; };
          const safeName = n => String(n || "berkas").replace(/[\\/:*?"<>|\u0000-\u001f]/g, "_").slice(0, 80) || "berkas";
          function hubSpec(drop) { return { id: "hub", type: "hub", drop: !!drop, items: hubItems.map(i => ({ id: i.id, name: i.name, glyph: i.glyph, thumb: i.thumb || "" })) }; }
          function refreshHub() {
            if (!S.live || !S.hub || !hubItems.length) { if (L.hub) setLive("hub", null); return; }
            setLive("hub", { id: "hub", p: 20, glyph: "📥", color: "#0a84ff", val: String(hubItems.length), panel: hubSpec(false) });
          }
          function addHubItem(it) {
            it.id = "h" + (hubSeq++);
            hubItems.unshift(it);
            if (hubItems.length > 12) hubItems.length = 12;
            if (!it.ic && it.path) app.getFileIcon(it.path, { size: "normal" }).then(i => { it.ic = i; }).catch(() => {});
          }
          const IMG_EXT = /\.(png|jpe?g|gif|webp|bmp)$/i;
          function fileItem(p, nameHint) {
            let st = null;
            try { st = fs.statSync(p); } catch (_) { return null; }
            const it = { kind: "file", path: p, name: nameHint || path.basename(p), glyph: st.isDirectory() ? "📁" : "📄", thumb: "", ic: null };
            if (!st.isDirectory() && IMG_EXT.test(p) && st.size < 20 * 1024 * 1024) {
              try {
                const ni = nativeImage.createFromPath(p);
                if (!ni.isEmpty()) { const s = ni.getSize(), k = 96 / Math.max(s.width, s.height); const t = k < 1 ? ni.resize({ width: Math.max(1, Math.round(s.width * k)), height: Math.max(1, Math.round(s.height * k)) }) : ni; it.thumb = t.toDataURL(); it.ic = t.resize({ width: 48 }); }
              } catch (_) {}
            }
            return it;
          }
          function hubDrop(d) {
            let added = 0;
            (Array.isArray(d.files) ? d.files : []).slice(0, 8).forEach(f => {
              const p = String((f && f.path) || "");
              if (!p || !path.isAbsolute(p)) return;
              const it = fileItem(p, String(f.name || ""));
              if (it) { addHubItem(it); added++; }
            });
            (Array.isArray(d.blobs) ? d.blobs : []).slice(0, 4).forEach(b => {
              try {
                const buf = Buffer.from(b.data);
                if (!buf.length || buf.length > 25 * 1024 * 1024) return;
                const p = path.join(hubDir(), Date.now() + "-" + safeName(b.name));
                fs.writeFileSync(p, buf);
                const it = fileItem(p, safeName(b.name));
                if (it) { addHubItem(it); added++; }
              } catch (_) {}
            });
            if (!added) {
              const url = String(d.url || "").split(/\r?\n/)[0].trim(), text = String(d.text || "");
              const body = /^https?:\/\//i.test(url) ? url : text;
              if (body) {
                try {
                  const p = path.join(hubDir(), (/^https?:/i.test(body) ? "tautan-" : "teks-") + Date.now() + (/^https?:/i.test(body) ? ".url" : ".txt"));
                  fs.writeFileSync(p, /^https?:/i.test(body) ? "[InternetShortcut]\r\nURL=" + body + "\r\n" : body, "utf8");
                  addHubItem({ kind: "text", path: p, name: body.replace(/\s+/g, " ").slice(0, 24), glyph: /^https?:/i.test(body) ? "🔗" : "📝", thumb: "", ic: null });
                  added++;
                } catch (_) {}
              }
            }
            hubDropPanel = false; hubDropAt = Date.now();
            disarmHub(false);
            refreshHub();
            if (added) toIsl("panel", { spec: hubSpec(false), sticky: true });
          }
          function hubDragOut(id) {
            const it = hubItems.find(x => x.id === id);
            if (!it || !it.path || !fs.existsSync(it.path)) return;
            let icon = it.ic;
            if ((!icon || icon.isEmpty()) && ownIcon) { try { icon = nativeImage.createFromDataURL(ownIcon).resize({ width: 32 }); } catch (_) {} }
            if (!icon || icon.isEmpty()) {   // cadangan: ikon kotak kecil supaya drag tetap jalan
              try { icon = nativeImage.createFromDataURL("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAFElEQVQY02NkYGD4z0AEYBxVSF+FAP5FDvcfRYWgAAAAAElFTkSuQmCC"); } catch (_) {}
              if (!icon || icon.isEmpty()) return;
            }
            try { isl.webContents.startDrag({ file: it.path, icon: icon }); } catch (_) {}
          }
          function hubEnter() {
            if (!S.hub || !S.live || !hubArmed) return;
            hubDropPanel = true;
            toIsl("panel", { spec: hubSpec(true), sticky: true });
          }
          function inHubZone(c, pad) {
            if (!isl || isl.isDestroyed() || S.edge !== "top") return false;
            const b = isl.getBounds(), cx = b.x + b.width / 2;
            return Math.abs(c.x - cx) < 190 + pad && c.y >= b.y - 4 && c.y < b.y + 140 + pad;
          }
          function armHub() {
            if (hubArmed || !isl || isl.isDestroyed()) return;
            hubArmed = true;
            try { isl.setIgnoreMouseEvents(false); } catch (_) {}
