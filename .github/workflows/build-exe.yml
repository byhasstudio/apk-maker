          "use strict";
          const { contextBridge, ipcRenderer, webUtils } = require("electron");
          const OK_IN = ["cfg", "show", "play", "sound", "stop", "live", "lvl", "panel", "dz"];
          const OK_OUT = ["mouse", "tap", "idle", "ready", "local", "act", "dragout"];
