            const url = String(dt.getData("text/uri-list") || "").slice(0, 2000);
            const files = [], pend = [];
            Array.prototype.forEach.call(dt.files || [], f => {
              let p = "";
              try { p = webUtils.getPathForFile(f); } catch (_) {}
              if (p) files.push({ path: p, name: f.name });
              else if (f.size > 0 && f.size < 25 * 1024 * 1024) pend.push(f.arrayBuffer().then(b => ({ name: f.name || "gambar.png", data: new Uint8Array(b) })).catch(() => null));
            });
            Promise.all(pend).then(b => ipcRenderer.send("fx:drop", { files: files, blobs: b.filter(Boolean), text: text, url: url }));
          }, true);
