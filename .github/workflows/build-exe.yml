              static readonly Dictionary<uint, string> names = new Dictionary<uint, string>();

              public static string ExeName(uint pid)
              {
                  string v;
                  lock (names)
                  {
                      if (names.TryGetValue(pid, out v)) return v;
                  }
                  v = "";
                  try { v = Process.GetProcessById((int)pid).ProcessName.ToLowerInvariant(); } catch (Exception) { }
                  lock (names)
                  {
                      if (names.Count > 600) names.Clear();
                      names[pid] = v;
                  }
                  return v;
