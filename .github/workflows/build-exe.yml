          }
          function loadContent() { if (cfg.url) win.loadURL(cfg.url); else win.loadFile("www/index.html"); }
          function showBlocked() { win.loadURL("data:text/html;charset=utf-8," + encodeURIComponent(BLOCK_HTML)); }
          const FORCE_HTML = '<!doctype html><meta charset="utf-8"><title>Perbarui</title><body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;font-family:Segoe UI,sans-serif;background:#111827;color:#f9fafb;text-align:center"><div><div style="font-size:64px">&#11015;</div><h2>Versi ini sudah usang</h2><p style="color:#9ca3af">Unduh versi terbaru untuk melanjutkan.</p><a target="_blank" href="__U__" style="display:inline-block;margin-top:12px;padding:12px 28px;border-radius:12px;background:#4f46e5;color:#fff;text-decoration:none;font-weight:700">Unduh versi terbaru</a></div></body>';
          function showForce(u) { win.loadURL("data:text/html;charset=utf-8," + encodeURIComponent(FORCE_HTML.split("__U__").join(encodeURI(u).split("'").join("%27")))); }
          function notify(st) {
            if (!st || !st.message || !st.mid) return;
            const f = path.join(app.getPath("userData"), "seen.txt");
            let seen = ""; try { seen = fs.readFileSync(f, "utf8"); } catch (_) {}
            if (seen === st.mid) return;
            try { fs.writeFileSync(f, st.mid); } catch (_) {}
            dialog.showMessageBox(win, { type: "info", title: cfg.name, message: String(st.message) });
          }
          async function applyState(st) {
            st = st || {};
            if (st.blocked) { if (!blocked) { blocked = true; showBlocked(); } return; }
            if (typeof st.force === "string" && /^https:/.test(st.force)) { if (forced !== st.force) { forced = st.force; blocked = false; showForce(st.force); } return; }
            if (blocked || forced) { blocked = false; forced = ""; loadContent(); }
            notify(st);
          }
          async function create() {
            Menu.setApplicationMenu(null);
            win = new BrowserWindow({ width: 1100, height: 760, title: cfg.name, autoHideMenuBar: true, show: !hidden,
              webPreferences: { contextIsolation: true, nodeIntegration: false, sandbox: true, preload: (fx && !cfg.url) ? path.join(__dirname, "fx", "preload.js") : undefined } });
            // F11 / Alt+Enter = layar penuh, Esc = keluar dari layar penuh (menu dimatikan, jadi harus ditangani manual)
            win.webContents.on("before-input-event", (ev, input) => {
              if (input.type !== "keyDown") return;
              if (input.key === "F11" || (input.alt && input.key === "Enter")) { win.setFullScreen(!win.isFullScreen()); ev.preventDefault(); }
              else if (input.key === "Escape" && win.isFullScreen()) { win.setFullScreen(false); ev.preventDefault(); }
            });
            if (cfg.url) {
              win.webContents.setWindowOpenHandler(({ url }) => { if (safe(url)) shell.openExternal(url); return { action: "deny" }; });
              win.webContents.on("will-navigate", (ev, u) => {
                try { if (new URL(u).hostname !== new URL(cfg.url).hostname) { ev.preventDefault(); if (safe(u)) shell.openExternal(u); } } catch (_) { ev.preventDefault(); }
              });
            }
            win.webContents.setWindowOpenHandler(({ url }) => { if (safe(url)) shell.openExternal(url); return { action: "deny" }; });
            if (fx) { try { fx.start({ app, win, cfg }); } catch (e) { console.error(e); } }
            if (cfg.tray) {
              try {
                tray = new Tray(path.join(__dirname, "icon.png"));
                tray.setToolTip(cfg.name);
                const mkMenu = () => Menu.buildFromTemplate([
                  { label: TT("Buka") + " " + cfg.name, click: () => { win.show(); win.focus(); } },
                  { label: TT("Jalan otomatis saat Windows menyala"), type: "checkbox", checked: fx ? fx.autoOn() : app.getLoginItemSettings({ args: ["--hidden"] }).openAtLogin, click: it => { if (fx) fx.setAuto(it.checked); else app.setLoginItemSettings({ openAtLogin: it.checked, args: ["--hidden"] }); } },
                  ...(fx ? fx.trayItems() : []),
                  { type: "separator" },
                  { label: TT("Keluar"), click: () => { quitting = true; app.quit(); } }
                ]);
                tray.setContextMenu(mkMenu());
                if (fx && fx.onLang) fx.onLang(() => { try { tray.setContextMenu(mkMenu()); } catch (_) {} });
                tray.on("click", () => { win.show(); win.focus(); });
                win.on("close", ev => { if (!quitting) { ev.preventDefault(); win.hide(); } });
              } catch (_) {}
            }
            // gagal memuat halaman utama (offline / situs tak terjangkau) -> tampilkan halaman "tidak ada koneksi"
            win.webContents.on("did-fail-load", (ev, code, desc, failedUrl, isMain) => {
              if (!isMain || code === -3 || blocked || !cfg.url) return;
              win.loadURL("data:text/html;charset=utf-8," + encodeURIComponent(offlineHtml()));
            });
            await applyState(await checkBlocked(true));
            if (!blocked && !forced) loadContent();
            // cek ulang tiap 10 menit: kalau diblokir/dibuka saat aplikasi berjalan, langsung berlaku
            setInterval(async () => { applyState(await checkBlocked()); }, 600000);
          }
          if (!app.requestSingleInstanceLock()) { app.quit(); } else {
            app.on("second-instance", () => { if (win) { if (!win.isVisible()) win.show(); if (win.isMinimized()) win.restore(); win.focus(); } });
            app.whenReady().then(create);
          }
          app.on("before-quit", () => { quitting = true; });
          app.on("window-all-closed", () => app.quit());
          `);
          JS
          # Jaring pengaman: pemeriksaan "aplikasi sedang berjalan" bawaan electron-builder dimatikan langsung di templatenya,
          # supaya dialog "cannot be closed" tidak mungkin muncul walau macro custom tidak terpakai.
          node - <<'JS2'
          const fs = require("fs"), path = require("path");
          const root = path.join(process.cwd(), "node_modules", "app-builder-lib", "templates", "nsis");
          function walk(d, out) {
            for (const e of fs.readdirSync(d, { withFileTypes: true })) {
              const f = path.join(d, e.name);
              if (e.isDirectory()) walk(f, out); else if (/\.nsh$/i.test(e.name)) out.push(f);
            }
            return out;
          }
          let patched = 0;
          for (const f of walk(root, [])) {
            const t = fs.readFileSync(f, "utf8");
            if (!/!macro\s+CHECK_APP_RUNNING\b/.test(t)) continue;
            fs.writeFileSync(f, t + "\n!ifmacrodef CHECK_APP_RUNNING\n!macroundef CHECK_APP_RUNNING\n!endif\n!macro CHECK_APP_RUNNING\n  !insertmacro killOthers\n!macroend\n");
            console.log("CHECK_APP_RUNNING dinonaktifkan di " + f);
            patched++;
          }
          if (!patched) console.log("::warning::template CHECK_APP_RUNNING tidak ditemukan; mengandalkan macro custom saja");
          JS2

      - name: Progress 40%
        run: |
          . "${GITHUB_WORKSPACE//\\//}/.pg.sh"
          pg 60 "Memulai build EXE"

      - name: Bangun EXE
        run: |
          set -euo pipefail
          . "${GITHUB_WORKSPACE//\\//}/.pg.sh"
          cd app
          npx electron-builder --win nsis --x64 --publish never &
          PID=$!
          P=62; T=0
          while kill -0 "$PID" 2>/dev/null; do
            sleep 1; T=$((T+1))
            if [ $((T % 15)) -eq 0 ]; then
              P=$((P+2)); [ $P -gt 88 ] && P=88
              if [ $P -lt 68 ]; then M="Mengunduh komponen Electron"; elif [ $P -lt 80 ]; then M="Mengemas aplikasi"; else M="Membuat installer"; fi
              pg $P "$M"
            fi
          done
          wait "$PID"
          test -f dist/app.exe

      - name: Progress 92%
        run: |
          . "${GITHUB_WORKSPACE//\\//}/.pg.sh"
          pg 92 "Menerbitkan EXE"

      - name: Terbitkan Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SAFE=$(printf '%s' "$APP_NAME" | tr -cs 'A-Za-z0-9' '-' | sed 's/^-//; s/-$//')
          [ -n "$SAFE" ] || SAFE=app
          mkdir -p out
          cp app/dist/app.exe "out/$SAFE.exe"
          gh release delete "job-$JOB_ID" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "job-$JOB_ID" "out/$SAFE.exe" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "EXE $SAFE" \
            --notes "EXE dibuat otomatis oleh pengguna. Tidak bertanda tangan digital; pakai dengan risiko sendiri."
          echo "APK_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/job-$JOB_ID/$SAFE.exe" >> "$GITHUB_ENV"

      - name: Pindai VirusTotal (opsional)
        if: ${{ env.VT_API_KEY != '' }}
        continue-on-error: true
        timeout-minutes: 12
        run: |
          . "${GITHUB_WORKSPACE//\\//}/.pg.sh"
          pg 94 "Memindai VirusTotal"
          FILE=$(ls out/*.exe | head -n 1) node - <<'JS'
          const fs = require("fs"), path = require("path");
          const key = process.env.VT_API_KEY, file = process.env.FILE;
          const H = { "x-apikey": key };
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            const up = await (await fetch("https://www.virustotal.com/api/v3/files/upload_url", { headers: H })).json();
            if (!up.data) throw new Error("upload_url gagal");
            const fd = new FormData();
            fd.append("file", new Blob([fs.readFileSync(file)]), path.basename(file));
            const r = await (await fetch(up.data, { method: "POST", headers: H, body: fd })).json();
            const id = r.data && r.data.id;
            if (!id) throw new Error("upload gagal");
            for (let i = 0; i < 40; i++) {
              await sleep(15000);
              const a = await (await fetch("https://www.virustotal.com/api/v3/analyses/" + id, { headers: H })).json();
              const at = a.data && a.data.attributes;
              if (at && at.status === "completed") {
                const st = at.stats || {};
                const sha = a.meta && a.meta.file_info && a.meta.file_info.sha256;
                if (!sha) throw new Error("tanpa sha256");
                const t = (st.malicious || 0) + (st.suspicious || 0) + (st.harmless || 0) + (st.undetected || 0);
                fs.writeFileSync("vt.json", JSON.stringify({ m: st.malicious || 0, s: st.suspicious || 0, t, sha }));
                console.log("VirusTotal selesai");
                return;
              }
            }
            throw new Error("timeout");
          })().catch(e => { console.error("VirusTotal dilewati:", e.message); process.exit(1); });
          JS
          echo "VT_JSON=$(cat vt.json)" >> "$GITHUB_ENV"

      - name: Kabari Worker (selesai)
        run: |
          curl -fsS --retry 3 --retry-delay 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"done\",\"apkUrl\":\"$APK_URL\",\"vt\":${VT_JSON:-null}}"

      - name: Kabari Worker (gagal)
        if: ${{ failure() }}
        run: |
          curl -sS --retry 3 --retry-delay 2 -X POST "$WORKER_URL/internal/status/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"failed\",\"runUrl\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" || true

      - name: Hapus file sementara
        if: ${{ always() }}
        run: |
          curl -sS -X DELETE "$WORKER_URL/internal/file/$JOB_ID" \
            -H "Authorization: Bearer $BUILD_SECRET" || true
