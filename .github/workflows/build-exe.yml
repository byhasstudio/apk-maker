                      {
                          if (!IsWindowVisible(h)) return true;
                          string t = Title(h);
                          if (t.Length == 0) return true;
                          Item it = new Item();
                          it.H = h;
                          it.Title = t;
                          GetWindowThreadProcessId(h, out it.Pid);
                          it.Exe = ExeName(it.Pid);
                          list.Add(it);
                      }
                      catch (Exception) { }
                      return true;
                  }, IntPtr.Zero);
                  return list;
              }

