              [DllImport("kernel32.dll", CharSet = CharSet.Unicode)] static extern bool QueryFullProcessImageName(IntPtr h, uint flags, StringBuilder sb, ref uint size);

              static string FullPath(uint pid)
              {
                  IntPtr h = OpenProcess(0x1000, false, pid);
                  if (h == IntPtr.Zero) return "";
                  try
                  {
                      StringBuilder sb = new StringBuilder(1024);
                      uint n = 1024;
                      if (QueryFullProcessImageName(h, 0, sb, ref n)) return sb.ToString();
                  }
                  finally { CloseHandle(h); }
                  return "";
              }

              static bool IsGame(string ne, string path)
              {
                  if (ne.Length == 0) return false;
                  if (Array.IndexOf(NoGame, ne) >= 0) return false;
                  if (Array.IndexOf(Extra, ne) >= 0) return true;
                  if (Array.IndexOf(NOTGAME, ne) >= 0) return false;
                  if (Array.IndexOf(GAMES, ne) >= 0) return true;
                  if (ne.EndsWith("-win64-shipping") || ne.EndsWith("-wingdk-shipping")) return true;
                  lock (gcs) { if (gcs.Contains(ne)) return true; }
                  string lp = path.ToLowerInvariant().Replace('/', '\\');
                  foreach (string m in GPATHS) if (lp.IndexOf(m, StringComparison.Ordinal) >= 0) return true;
                  return false;
              }

              [DllImport("dwmapi.dll")] static extern int DwmGetCompositionTimingInfo(IntPtr hwnd, IntPtr info);

              static ulong ReadFrame(IntPtr buf, ref int good)
              {
                  // cbSize berbeda antar versi Windows: coba beberapa ukuran sampai sistem menerimanya
                  int[] sizes = good > 0 ? new int[] { good } : new int[] { 200, 232, 256, 264, 272, 280, 288, 296, 304, 312, 320, 168, 176, 184, 192, 208, 216, 224, 240, 248 };
                  foreach (int sz in sizes)
                  {
                      Marshal.WriteInt32(buf, 0, sz);
                      for (int i = 4; i < sz; i += 4) Marshal.WriteInt32(buf, i, 0);
                      Marshal.WriteInt32(buf, 0, sz);
                      if (DwmGetCompositionTimingInfo(IntPtr.Zero, buf) == 0)
                      {
                          good = sz;
                          return (ulong)Marshal.ReadInt64(buf, 64);
                      }
                  }
                  return 0;
              }

              public static void Game()
              {
                  IntPtr buf = Marshal.AllocHGlobal(512);
                  int good = 0, loop = 0;
                  bool full = false;
                  string exe = "", curLast = "";
                  ulong lastF = 0;
                  DateTime lastT = DateTime.UtcNow;
                  LoadGcs();
                  while (true)
                  {
                      Thread.Sleep(700);
                      if (++loop % 90 == 0) LoadGcs();
                      bool nf = false;
                      string ne = "";
                      try
                      {
                          IntPtr fg = Wnd.GetForegroundWindow();
                          if (fg != IntPtr.Zero && Wnd.IsWindowVisible(fg) && !Wnd.IsIconic(fg))
                          {
                              uint pid = Wnd.PidOf(fg);
                              ne = Wnd.ExeName(pid);
                              nf = IsGame(ne, FullPath(pid));
                          }
                      }
                      catch (Exception) { }
                      string ge = nf ? ne : "";
                      if (nf != full || ge != exe || ne != curLast)
                      {
                          full = nf; exe = ge; curLast = ne;
                          Program.Emit("{\"t\":\"fg\",\"full\":" + (full ? 1 : 0) + ",\"exe\":" + Program.J(exe) + ",\"cur\":" + Program.J(ne) + "}");
                          lastF = 0;
                      }
                      if (full)
                      {
                          try
                          {
                              ulong f = ReadFrame(buf, ref good);
                              DateTime now = DateTime.UtcNow;
                              double dt = (now - lastT).TotalSeconds;
                              lastT = now;
                              int fps = -1;
                              if (f != 0 && lastF != 0 && f >= lastF && dt > 0.2) fps = (int)Math.Round((f - lastF) / dt);
                              if (f != 0) lastF = f;
                              if (fps >= 0 && fps < 1000) Program.Emit("{\"t\":\"fps\",\"v\":" + fps + "}");
                          }
                          catch (Exception) { }
                      }
                  }
              }

              // ----- daftar aplikasi yang jendelanya sedang terbuka (untuk pemilih game manual)
              public static void Wins()
              {
                  string[] skipExe = new string[] { "textinputhost", "searchhost", "startmenuexperiencehost", "shellexperiencehost", "applicationframehost", "lockapp", "systemsettings" };
                  string[] skipCls = new string[] { "Progman", "WorkerW", "Shell_TrayWnd", "Shell_SecondaryTrayWnd" };
                  List<string> seen = new List<string>();
                  StringBuilder sb = new StringBuilder("{\"t\":\"wins\",\"l\":[");
                  int n = 0;
                  foreach (Wnd.Item it in Wnd.Visible())
                  {
                      if (n >= 40) break;
                      if (it.Exe.Length == 0 || seen.Contains(it.Exe)) continue;
                      if (Array.IndexOf(skipExe, it.Exe) >= 0) continue;
                      if (Array.IndexOf(skipCls, Wnd.Cls(it.H)) >= 0) continue;
                      seen.Add(it.Exe);
                      string t = it.Title.Length > 60 ? it.Title.Substring(0, 60) : it.Title;
                      if (n > 0) sb.Append(',');
                      sb.Append("{\"n\":").Append(Program.J(it.Exe)).Append(",\"t\":").Append(Program.J(t)).Append('}');
                      n++;
                  }
                  sb.Append("]}");
                  Program.Emit(sb.ToString());
              }

              // ----- ping
              public static void PingLoop()
              {
                  System.Net.NetworkInformation.Ping p = new System.Net.NetworkInformation.Ping();
                  string[] hosts = new string[] { "1.1.1.1", "8.8.8.8" };
                  int hi = 0;
                  while (true)
                  {
                      Thread.Sleep(1500);
                      if (!Program.PingOn) continue;
                      try
                      {
                          PingReply r = p.Send(hosts[hi], 1200);
                          if (r != null && r.Status == IPStatus.Success) Program.Emit("{\"t\":\"ping\",\"ms\":" + r.RoundtripTime + ",\"loss\":0}");
                          else { Program.Emit("{\"t\":\"ping\",\"ms\":-1,\"loss\":1}"); hi = (hi + 1) % hosts.Length; }
                      }
                      catch (Exception) { hi = (hi + 1) % hosts.Length; }
                  }
              }

              // ----- papan klip: beri tahu setiap kali isinya berubah (nomor urut dari Windows, murah)
              [DllImport("user32.dll")] static extern uint GetClipboardSequenceNumber();

              public static void Clip()
              {
                  uint last = GetClipboardSequenceNumber();
                  while (true)
                  {
                      Thread.Sleep(250);
                      uint n = GetClipboardSequenceNumber();
                      if (n != last)
                      {
                          last = n;
                          Program.Emit("{\"t\":\"clip\",\"n\":" + n + "}");
                      }
                  }
              }

              // ----- tombol kiri mouse (untuk mendeteksi seret-dan-lepas)
              [DllImport("user32.dll")] static extern short GetAsyncKeyState(int vk);

              public static void Mouse()
              {
                  bool last = false;
                  while (true)
                  {
                      Thread.Sleep(20);
                      if (!Program.BtnOn) { if (last) { last = false; Program.Emit("{\"t\":\"btn\",\"l\":0}"); } Thread.Sleep(150); continue; }
                      bool d = (GetAsyncKeyState(0x01) & 0x8000) != 0;
                      if (d != last)
                      {
                          last = d;
                          Program.Emit("{\"t\":\"btn\",\"l\":" + (d ? 1 : 0) + "}");
                      }
                  }
              }
          }

          // ---------------------------------------------------------------- kursor kustom

          static class CursorFx
          {
              [StructLayout(LayoutKind.Sequential)]
              struct ICONINFO { public bool fIcon; public int xHotspot; public int yHotspot; public IntPtr hbmMask; public IntPtr hbmColor; }
              [DllImport("user32.dll")] static extern bool SetSystemCursor(IntPtr hcur, uint id);
              [DllImport("user32.dll")] static extern bool SystemParametersInfo(uint a, uint b, IntPtr c, uint d);
              [DllImport("user32.dll")] static extern IntPtr CreateIconIndirect(ref ICONINFO ii);
              [DllImport("user32.dll")] static extern bool GetIconInfo(IntPtr h, out ICONINFO ii);
              [DllImport("user32.dll")] static extern bool DestroyIcon(IntPtr h);
              [DllImport("gdi32.dll")] static extern bool DeleteObject(IntPtr h);

              static bool changed = false;

              static Color Parse(string hex)
              {
                  try
                  {
                      hex = hex.TrimStart('#');
                      if (hex.Length == 6) return Color.FromArgb(Convert.ToInt32(hex.Substring(0, 2), 16), Convert.ToInt32(hex.Substring(2, 2), 16), Convert.ToInt32(hex.Substring(4, 2), 16));
                  }
                  catch (Exception) { }
                  return Color.White;
              }

              static Bitmap Draw(string style, Color c, int s, out int hx, out int hy)
              {
                  Bitmap bmp = new Bitmap(s, s, System.Drawing.Imaging.PixelFormat.Format32bppArgb);
                  using (Graphics g = Graphics.FromImage(bmp))
                  {
                      g.SmoothingMode = SmoothingMode.AntiAlias;
                      g.Clear(Color.Transparent);
                      hx = 2; hy = 2;
                      float m = 2f, u = s - 5f;
                      using (Pen edge = new Pen(Color.FromArgb(230, 20, 20, 24), 2.2f))
                      using (Brush fill = new SolidBrush(c))
                      using (Pen line = new Pen(c, 2.6f))
                      {
                          edge.LineJoin = LineJoin.Round;
                          if (style == "ring")
                          {
                              hx = s / 2; hy = s / 2;
                              float d = s * 0.62f, o = (s - d) / 2f;
                              g.DrawEllipse(edge, o - 1f, o - 1f, d + 2f, d + 2f);
                              g.DrawEllipse(line, o, o, d, d);
                              g.FillEllipse(fill, s / 2f - 2f, s / 2f - 2f, 4f, 4f);
                          }
                          else if (style == "dot")
                          {
                              hx = s / 2; hy = s / 2;
                              float d = s * 0.34f, o = (s - d) / 2f;
                              g.FillEllipse(new SolidBrush(Color.FromArgb(235, 20, 20, 24)), o - 1.5f, o - 1.5f, d + 3f, d + 3f);
                              g.FillEllipse(fill, o, o, d, d);
                          }
                          else if (style == "cross")
                          {
                              hx = s / 2; hy = s / 2;
                              float h = s / 2f, gap = s * 0.12f, e = s * 0.42f;
                              g.DrawLine(edge, h - e, h, h - gap, h); g.DrawLine(edge, h + gap, h, h + e, h);
                              g.DrawLine(edge, h, h - e, h, h - gap); g.DrawLine(edge, h, h + gap, h, h + e);
                              g.DrawLine(line, h - e, h, h - gap, h); g.DrawLine(line, h + gap, h, h + e, h);
                              g.DrawLine(line, h, h - e, h, h - gap); g.DrawLine(line, h, h + gap, h, h + e);
                          }
                          else
                          {
                              PointF[] pts = new PointF[] {
                                  new PointF(m, m), new PointF(m, m + u * 0.86f), new PointF(m + u * 0.22f, m + u * 0.68f),
                                  new PointF(m + u * 0.36f, m + u), new PointF(m + u * 0.5f, m + u * 0.93f), new PointF(m + u * 0.36f, m + u * 0.63f),
                                  new PointF(m + u * 0.64f, m + u * 0.63f) };
                              g.DrawPolygon(edge, pts);
                              g.FillPolygon(fill, pts);
                          }
                      }
                  }
                  return bmp;
              }

              static IntPtr MakeCursor(Bitmap bmp, int hx, int hy)
              {
                  IntPtr hi = bmp.GetHicon();
                  ICONINFO ii;
                  if (!GetIconInfo(hi, out ii)) { DestroyIcon(hi); return IntPtr.Zero; }
                  ii.fIcon = false;
                  ii.xHotspot = hx;
                  ii.yHotspot = hy;
                  IntPtr cur = CreateIconIndirect(ref ii);
                  if (ii.hbmMask != IntPtr.Zero) DeleteObject(ii.hbmMask);
                  if (ii.hbmColor != IntPtr.Zero) DeleteObject(ii.hbmColor);
                  DestroyIcon(hi);
                  return cur;
              }

              public static void Apply(string style, string hex, int size)
              {
                  if (size < 20) size = 20;
                  if (size > 64) size = 64;
                  Color c = Parse(hex);
                  uint[] ids = new uint[] { 32512, 32649 };  // panah, tangan
                  foreach (uint id in ids)
                  {
                      int hx, hy;
                      using (Bitmap bmp = Draw(style, c, size, out hx, out hy))
                      {
                          IntPtr cur = MakeCursor(bmp, hx, hy);
                          if (cur != IntPtr.Zero && SetSystemCursor(cur, id)) changed = true;
                      }
                  }
              }

              public static void Restore()
              {
                  if (!changed) return;
                  changed = false;
                  SystemParametersInfo(0x0057, 0, IntPtr.Zero, 0);
              }
          }
