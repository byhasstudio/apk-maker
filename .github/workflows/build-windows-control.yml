name: Build Remote Control EXE (Windows)
run-name: Build Remote Control EXE ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi aplikasi, contoh 0.2.0 (wajib dinaikkan tiap kali mau pengguna lama dapat notifikasi update)"
        required: true
        type: string
      changelog:
        description: "Catatan pembaruan yang akan tampil di pop-up update pengguna"
        required: false
        type: string
        default: "Perbaikan dan peningkatan kecil."

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows-control
    steps:
      - uses: actions/checkout@v4

      - name: Cek format versi
        shell: bash
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Format versi harus x.y.z, contoh 0.2.0"; exit 1; }

      - name: Terapkan nomor versi ke proyek
        shell: bash
        run: |
          sed -i "s/CurrentVersion = \".*\";/CurrentVersion = \"${{ inputs.version }}\";/" UpdateChecker.cs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish EXE mandiri (satu file, tanpa perlu install .NET)
        run: |
          dotnet publish RemoteCtlAgent.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

      - name: Unggah EXE sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-ctl-windows-exe
          path: windows-control/publish/RemoteCtlAgent.exe
          retention-days: 14

      - name: Buat GitHub Release (sumber info update otomatis)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ inputs.version }}
          name: Remote Ctl Windows v${{ inputs.version }}
          body: ${{ inputs.changelog }}
          files: windows-control/publish/RemoteCtlAgent.exe
