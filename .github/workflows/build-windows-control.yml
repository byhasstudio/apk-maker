name: Build Remote Control EXE (Windows)
run-name: Build Remote Control EXE

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows-control
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish EXE mandiri (satu file, tanpa perlu install .NET)
        run: |
          dotnet publish RemoteCtlAgent.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

      - name: Unggah EXE sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-ctl-windows-exe
          path: windows-control/publish/RemoteCtlAgent.exe
          retention-days: 14
